<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>현재 Expo · 전체 화면 탐색</title><link rel="stylesheet" href="/appmap/style.css"></head>
<body><header>
  <div class="heading"><h1>현재 Expo · 전체 화면 탐색</h1><span id="counts"></span><a href="/" target="_blank" rel="noopener">기본 Expo ↗</a></div>
  <p class="hint">탭 순서는 프로토타입과 동일합니다. 아래 화면은 복제본이 아닌 실제 Expo입니다. 로컬 개발 데이터로 동작합니다.</p>
  <nav id="domains" aria-label="영역"></nav><nav id="screens" aria-label="페이지"></nav><nav id="subscreens" aria-label="하위 페이지"></nav><nav id="popups" aria-label="팝업·상태"></nav>
  <div id="breadcrumb"></div>
</header>
<section class="toolbar" aria-label="보기 설정">
  <label>화면 폭 <select id="width"><option value="390">390px</option><option value="320">320px</option><option value="430">430px</option></select></label>
  <label id="entity-label" hidden>실제 데이터 <select id="entity"></select></label>
  <button id="reload">현재 탭 다시 열기</button>
  <details><summary>전체 목록·숨김 화면</summary><div id="inventory"></div></details>
</section>
<p id="status" role="status" aria-live="polite"></p>
<main><section><h2>실제 Expo <small id="actual-path"></small></h2><iframe id="expo" title="현재 Expo 실제 화면"></iframe></section></main>
<script type="module" src="/appmap/app.js"></script></body></html>
