# Supabase 로컬 개발 설정. `supabase start` 로 기동.
project_id = "sikjae"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 15

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:8081"
# 사장님 = 매장 소유자. 이메일/소셜 로그인은 1차 범위 결정에 따름.
enable_signup = true

[auth.email]
enable_confirmations = false

[storage]
enabled = true
# OCR 캡처 이미지(2차) · 영수증 보관용 버킷은 마이그레이션에서 생성.
