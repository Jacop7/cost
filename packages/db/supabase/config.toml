# Supabase 로컬 개발 설정. `supabase start` 로 기동.
project_id = "sikjae"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 15

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:8081"
# 사장님 = 매장 소유자. 이메일/소셜 로그인은 1차 범위 결정에 따름.
enable_signup = true

[auth.email]
enable_confirmations = false

# 로컬 메일 캐처(Inbucket) — 기본 포트 54324 가 이 머신에서 Hyper-V/WSL 예약 범위와 충돌해
# 컨테이너 기동이 실패한다. 이메일 확인이 꺼져 있어(enable_confirmations=false) 메일을 받을 일이
# 없으므로 끈다. 이메일 인증 흐름을 테스트해야 하면 enabled=true 로 켜고 port 를 비어 있는 값으로 바꿀 것.
[inbucket]
enabled = false

# 로컬 분석 스택(Vector + Logflare) — Vector 가 Docker 소켓을 직접 읽어야 하는데
# 이 머신은 tcp://localhost:2375 노출이 꺼져 있어 컨테이너가 unhealthy 로 죽는다
# ("Listing currently running containers failed: Connection refused").
# 개발용 로그 대시보드일 뿐이라 앱 개발·RPC 검증에는 필요 없다.
[analytics]
enabled = false

[storage]
enabled = true
# OCR 캡처 이미지(2차) · 영수증 보관용 버킷은 마이그레이션에서 생성.
