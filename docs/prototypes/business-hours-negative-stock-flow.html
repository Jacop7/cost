<body>
  <main class="workspace">
    <section class="catalog">
      <div class="catalog-head"><h1>영업시간 · 재고 부족 통합</h1><span>영업 시작 · 판매 · 재고 추가</span></div>
      <nav class="nav" aria-label="화면 선택">
        <button class="on" data-screen="sales">매출 상태</button>
        <button data-screen="hours">영업시간 설정</button>
        <button data-screen="past">과거 매출 수정</button>
      </nav>
      <div class="scenarios" id="scenarios" aria-label="상태 선택"></div>
    </section>

    <section class="phone" aria-label="모바일 앱 화면">
      <div class="statusbar"><span>9:41</span><span>● ◉ ▰</span></div>
      <header class="header"><button class="back" id="back" aria-label="뒤로">‹</button><div class="title" id="title">매출관리</div><button class="header-action" id="header-action"></button></header>
      <div class="content" id="content"></div>
      <div id="footer"></div>
      <div class="overlay" id="overlay" role="dialog" aria-modal="true"><section class="sheet"><div class="handle"></div><div id="sheet-body"></div></section></div>
      <div class="toast" id="toast" role="status" aria-live="polite"></div>
    </section>
  </main>

  <script>
    const $=id=>document.getElementById(id);
    const requestedScreen=new URLSearchParams(location.search).get('screen');
    const screenNames=['sales','sale_entry','stock_check','stock_add','hours','past'];
    let screen=screenNames.includes(requestedScreen)?requestedScreen:'sales';
    let salesState='before';
    const requestedPastCase=new URLSearchParams(location.search).get('case');
    let pastCase=requestedPastCase==='missing'?'missing':'existing';
    let pastEditing=new URLSearchParams(location.search).get('edit')==='1';
    const pastSales={existing:{bulgogi:5,stew:11,pork:12,rice:4,egg:4},missing:{bulgogi:0,stew:0,pork:0,rice:0,egg:0}};
    let openTime='11:00';
    let closeTime='22:00';
    let breakEnabled=true;
    let breakStartTime='15:00';
    let breakEndTime='17:00';
    let selectedDays=['월','화','수','목','금','토'];
    let checkSource=new URLSearchParams(location.search).get('source')==='sale'?'sale':'start';
    const requestedIngredient=new URLSearchParams(location.search).get('ingredient');
    let selectedIngredient=['beef','onion','green','garlic','tofu'].includes(requestedIngredient)?requestedIngredient:'beef';
    let stockPurchaseChoice={mode:'none',label:'미선택'};
    let stockVendor='';
    let stockPackQty=1;
    let stockVolume='3';
    let stockUnit='kg';
    let stockAmount='36,000';
    let stockStateIngredient='beef';
    function timeToMinutes(value){const [hour,minute]=value.split(':').map(Number);return hour*60+minute}
    function overnightFor(open,close){return timeToMinutes(close)<timeToMinutes(open)}
    function hoursSpan(open,close){const difference=timeToMinutes(close)-timeToMinutes(open);return difference<=0?difference+1440:difference}
    function hoursSpanLabel(minutes){const hours=Math.floor(minutes/60),rest=minutes%60;return rest?`${hours}시간 ${rest}분`:`${hours}시간`}
    function businessHoursLabel(){return `${openTime}–${overnightFor(openTime,closeTime)?'다음 날 ':''}${closeTime}`}
    function timeInBusinessLabel(value){return `${overnightFor(openTime,closeTime)&&timeToMinutes(value)<timeToMinutes(openTime)?'다음 날 ':''}${value}`}
    function breakHoursLabel(){return `${timeInBusinessLabel(breakStartTime)}–${timeInBusinessLabel(breakEndTime)}`}
    function validBreakRange(start,end){const open=timeToMinutes(openTime),overnight=overnightFor(openTime,closeTime),close=timeToMinutes(closeTime)+(overnight?1440:0);let breakStart=timeToMinutes(start),breakEnd=timeToMinutes(end);if(overnight&&breakStart<open)breakStart+=1440;if(overnight&&breakEnd<open)breakEnd+=1440;return breakStart>open&&breakEnd>breakStart&&breakEnd<close}
    const resolvedIngredients=new Set();
    const expandedRecipes=new Set();
    let saleRecorded=false;
    const quantities={bulgogi:10,stew:5};
    const ingredients={
      beef:{name:'소고기 불고기감',current:'−750g',safe:'2kg',startNeed:'150g',saleNeed:'1.5kg',startShortage:'900g',saleShortage:'2.25kg',addQty:'3',unit:'kg',amount:'36,000',before:'13.00원/g',after:'12.75원/g',purchase:'마장축산 · 소고기 3kg'},
      onion:{name:'양파',current:'200g',safe:'1kg',startNeed:'50g',saleNeed:'500g',startShortage:'800g',saleShortage:'300g',addQty:'2',unit:'kg',amount:'3,600',before:'1.89원/g',after:'1.86원/g',purchase:'동네마트 · 양파 2kg'},
      green:{name:'대파',current:'−20g',safe:'1kg',startNeed:'50g',saleNeed:'250g',startShortage:'1.02kg',saleShortage:'270g',addQty:'1',unit:'kg',amount:'4,000',before:'4.00원/g',after:'4.00원/g',purchase:'동네마트 · 대파 1kg'},
      garlic:{name:'다진마늘',current:'80g',safe:'300g',startNeed:'10g',saleNeed:'100g',startShortage:'220g',saleShortage:'20g',addQty:'500',unit:'g',amount:'4,250',before:'8.50원/g',after:'8.50원/g',purchase:'식자재마트 · 다진마늘 500g'},
      tofu:{name:'두부',current:'0개',safe:'6개',startNeed:'1개',saleNeed:'5개',startShortage:'6개',saleShortage:'5개',addQty:'12',unit:'개',amount:'9,600',before:'800원/개',after:'800원/개',purchase:'동네마트 · 두부 12개'}
    };
    const recipeShortages=[
      {key:'bulgogi',name:'소불고기',saleBasis:'10개 판매 기준',ingredients:['beef','onion','green','garlic']},
      {key:'stew',name:'김치찌개',saleBasis:'5개 판매 기준',ingredients:['green','tofu']}
    ];

    const stateData={
      before:{label:'영업 전',tone:'gray',hours:'11:00–22:00',actions:[['start','영업 시작','primary-small']],className:''},
      open:{label:'영업 중',tone:'green',hours:'11:00–22:00',actions:[['manage']],className:'state-open'},
      break:{label:'브레이크 중',tone:'amber',hours:'11:00–22:00',actions:[['manage']],className:'state-break'},
      closedManual:{label:'영업 종료',tone:'closed',hours:'11:00–21:30',actions:[],className:'state-closed'},
      closedAuto:{label:'자동 영업종료',tone:'closed',hours:'11:00–22:00',actions:[],className:'state-closed'}
    };

    function unresolvedKeys(recipe){return recipe.ingredients.filter(key=>!resolvedIngredients.has(key))}
    function shortageCount(){return new Set(recipeShortages.flatMap(unresolvedKeys)).size}
    function shortageRecipeCount(){return recipeShortages.filter(recipe=>unresolvedKeys(recipe).length>0).length}
    function domainScreen(){return ['sale_entry','stock_check','stock_add'].includes(screen)?'sales':screen}
    function setScreen(next){screen=next;closeSheet();const ingredientQuery=next==='stock_add'?`&ingredient=${selectedIngredient}`:'';history.replaceState(null,'',`${location.pathname}?screen=${next}${ingredientQuery}`);render();$('content').scrollTop=0}

    const scenarioButtons=()=>screen==='sales'?Object.entries({before:'영업 전',open:'영업 중',break:'브레이크',closedManual:'영업 종료',closedAuto:'자동 영업종료'}).map(([key,label])=>`<button class="${salesState===key?'on':''}" data-state="${key}">${label}</button>`).join(''):'';

    function stockNotice(){const count=shortageCount();if(count===0)return'';return `<button class="stock-notice" type="button" data-open-stock><span class="notice-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.3 3.8 2.5 17.3A2 2 0 0 0 4.2 20h15.6a2 2 0 0 0 1.7-2.7L13.7 3.8a2 2 0 0 0-3.4 0Z"/><path d="M12 9v4"/><path d="M12 17h.01"/></svg></span><span class="notice-copy"><b>식재료 부족 ${count}개</b><small>부족한 식재료의 재고를 추가해 주세요</small></span><span class="chev">›</span></button>`}

    function salesScreen(){const s=stateData[salesState];const hasManage=s.actions.some(([key])=>key==='manage');const info=`<span class="state-info"><span class="state-date"><strong>8월 24일</strong><small>(월)</small></span><span class="state-hours">${s.hours}</span></span>`;const status=hasManage?`<button class="pill status-select" data-state-action="manage">${s.label}<span class="drop-caret">⌄</span></button>`:s.actions.length?'':`<span class="pill ${s.tone}" style="margin-left:auto">${s.label}</span>`;const actions=hasManage?'':s.actions.length?`<div class="state-actions">${s.actions.map(([key,label,className])=>`<button class="${className}" data-state-action="${key}">${label}</button>`).join('')}</div>`:'';const before=salesState==='before';return `${stockNotice()}<section class="card day-state ${s.className}"><div class="state-top">${info}${status}${actions}</div></section><section class="card hero"><small>오늘 순이익</small><b>${before?'—':'94,913원'}</b><span>${before?'영업을 시작하면 오늘 기록이 열려요':'매출 529,500원 · 순이익률 17.9%'}</span></section><div class="section">오늘 판매</div><section class="card"><div class="menu-row"><span class="menu-copy"><strong>제육볶음</strong><small>판매가 12,000원 · 재료비 2,806원</small></span><span class="menu-value"><b>${before?'0개':'12개'}</b><small>${before?'':'144,000원'}</small></span></div><div class="menu-row"><span class="menu-copy"><strong>김치찌개</strong><small>판매가 9,000원 · 재료비 3,264원</small></span><span class="menu-value"><b>${before?'0개':'11개'}</b><small>${before?'':'99,000원'}</small></span></div><div class="menu-row"><span class="menu-copy"><strong>소불고기</strong><small>판매가 14,500원 · 재료비 4,789원</small></span><span class="menu-value"><b>${before?'0개':'5개'}</b><small>${before?'':'72,500원'}</small></span></div></section>`}

    function saleEntryScreen(){const total=quantities.bulgogi+quantities.stew;const amount=quantities.bulgogi*14500+quantities.stew*9000;const bulgogiCount=unresolvedKeys(recipeShortages[0]).length;const stewCount=unresolvedKeys(recipeShortages[1]).length;return `${stockNotice()}<section class="card day-summary"><div class="summary-row"><span>영업일</span><b>8월 24일 (월)</b></div><div class="summary-row"><span>판매 채널</span><b>매장</b></div></section><div class="section">메뉴별 판매 수량</div><section class="card"><div class="menu-row"><span class="menu-copy"><strong>소불고기</strong><small>14,500원${bulgogiCount?` · 부족 재료 ${bulgogiCount}개`:''}</small></span><span class="quantity-counter"><button type="button" data-count="bulgogi" data-delta="-1">−</button><b>${quantities.bulgogi}</b><button type="button" data-count="bulgogi" data-delta="1">+</button></span></div><div class="menu-row"><span class="menu-copy"><strong>김치찌개</strong><small>9,000원${stewCount?` · 부족 재료 ${stewCount}개`:''}</small></span><span class="quantity-counter"><button type="button" data-count="stew" data-delta="-1">−</button><b>${quantities.stew}</b><button type="button" data-count="stew" data-delta="1">+</button></span></div></section><section class="card day-summary"><div class="summary-row"><span>판매 수량</span><b>${total}개</b></div><div class="summary-row"><span>매출 합계</span><b>${amount.toLocaleString('ko-KR')}원</b></div></section>`}

    function ingredientRow(key,isStart){const item=ingredients[key];const comparisonLabel=isStart?'안전재고':'필요 수량';const comparisonValue=isStart?item.safe:item.saleNeed;return `<button class="ingredient-row" type="button" data-add-stock="${key}"><span class="ingredient-top"><strong>${item.name}</strong><span class="chev">›</span></span><span class="ingredient-compare"><span>${comparisonLabel}<b>${comparisonValue}</b></span><span>현재 재고<b class="red">${item.current}</b></span></span></button>`}

    function recipeCard(recipe,isStart){const keys=unresolvedKeys(recipe);if(keys.length===0)return'';const expanded=expandedRecipes.has(recipe.key);const visible=expanded?keys:keys.slice(0,3);const hidden=keys.length-visible.length;const basis=isStart?'':`<small>${saleRecorded?'판매 기록 기준':recipe.saleBasis}</small>`;return `<section class="card"><div class="recipe-head"><span><strong>${recipe.name}</strong>${basis}</span><strong class="recipe-count">부족 재료 ${keys.length}개</strong></div>${visible.map(key=>ingredientRow(key,isStart)).join('')}${keys.length>3?`<button class="recipe-more" type="button" data-toggle-recipe="${recipe.key}">${expanded?'접기':`${hidden}개 더보기`}</button>`:''}</section>`}

    function stockCheckScreen(){const isStart=checkSource==='start';const recipeCount=shortageRecipeCount();if(recipeCount===0)return `<section class="card empty"><b>확인이 필요한 재고가 없어요</b><p>추가한 재고가 연결된 모든 레시피에 반영됐어요.</p></section><button class="outline-action" type="button" data-all-low>전체 부족 재고 보기</button>`;return `${recipeShortages.map(recipe=>recipeCard(recipe,isStart)).join('')}<button class="outline-action" type="button" data-all-low>전체 부족 재고 보기</button>`}

    function stockAddScreen(){const item=ingredients[selectedIngredient];return `<section class="card ingredient-hero"><div class="ingredient-name">${item.name}</div><div class="ingredient-status"><span>현재 재고</span><b>${item.current}</b></div></section><div class="section">입고 정보</div><section class="card form-card"><label class="form-field"><span>추가 수량</span><span class="input-wrap"><input id="stock-quantity" type="number" min="0.001" step="0.001" value="${item.addQty}" inputmode="decimal"><select id="stock-unit"><option selected>${item.unit}</option><option>${item.unit==='kg'?'g':'kg'}</option></select></span></label><label class="form-field"><span>구매 금액</span><span class="input-wrap"><input id="stock-amount" type="text" value="${item.amount}" inputmode="numeric"><b>원</b></span></label></section><div class="section">구매한 곳 · 선택</div><section class="card form-card"><button class="optional-row" type="button" data-purchase-option><span>구매 링크 옵션</span><b>선택 안 함</b><span class="chev">›</span></button></section><section class="card"><div class="preview-row"><span>기준단가</span><b>${item.before} → <em>${item.after}</em></b></div></section>`}

    function hoursScreen(){const days=['월','화','수','목','금','토','일'];return `<div class="section">요일 설정</div><section class="card"><div class="weekday-checks">${days.map(day=>`<button class="${selectedDays.includes(day)?'on':''}" data-day-check="${day}" aria-pressed="${selectedDays.includes(day)}">${day}</button>`).join('')}</div></section><div class="section">시간 설정</div><section class="card"><button class="time-row" data-edit-hours><span class="time-label">영업시간</span><span class="time-value"><b>${businessHoursLabel()}</b></span><span class="chev">›</span></button><button class="time-row" data-break><span class="time-label">브레이크 타임</span><span class="time-value"><b>${breakEnabled?breakHoursLabel():'사용 안 함'}</b></span><span class="chev">›</span></button></section>`}

    function pastScreen(){const missing=pastCase==='missing';return `<div class="case-switch"><button class="${!missing?'on':''}" data-past-case="existing">기록 있는 날짜</button><button class="${missing?'on':''}" data-past-case="missing">기록 없는 날짜</button></div>${missing?'<section class="card estimate"><strong>손익 기준값 없음</strong><p>8월 18일은 영업 기록이 없어 현재 판매가·원가로 추정해야 해요.</p></section>':''}<section class="card day-summary"><div class="summary-row"><span>영업일</span><b>${missing?'8월 18일 (화)':'8월 22일 (토)'}</b></div><div class="summary-row"><span>상태</span><b>${missing?'<span class="pill amber">기록 없음</span>':'<span class="pill gray">영업 종료</span>'}</b></div><div class="summary-row"><span>판매 수량</span><b>${missing?'0개':'37개'}</b></div><div class="summary-row"><span>매출 합계</span><b>${missing?'0원':'529,500원'}</b></div></section><div class="section">메뉴 매출</div><section class="card"><div class="menu-row"><span class="menu-copy"><strong>제육볶음</strong><small>${missing?'기록 없음':'12개 · 매장 10 · 배달 1 · 포장 1'}</small></span><span class="menu-value"><b>${missing?'—':'144,000원'}</b></span></div><div class="menu-row"><span class="menu-copy"><strong>김치찌개</strong><small>${missing?'기록 없음':'11개 · 매장 5 · 배달 4 · 포장 2'}</small></span><span class="menu-value"><b>${missing?'—':'99,000원'}</b></span></div></section>`}

    function openSheet(html){$('sheet-body').innerHTML=html;$('overlay').classList.add('open')}
    function closeSheet(){$('overlay').classList.remove('open')}
    function showToast(message){$('toast').textContent=message;$('toast').classList.add('show');setTimeout(()=>$('toast').classList.remove('show'),1800)}

    function openStockWarning(type){const start=type==='start';const items=recipeShortages.map(recipe=>{const count=unresolvedKeys(recipe).length;const basis=start?'':`<small>${recipe.saleBasis}</small>`;return count?`<div class="warning-item"><span><b>${recipe.name}</b>${basis}</span><strong>부족 재료 ${count}개</strong></div>`:''}).join('');openSheet(`<h2>${start?'현재 재고가 부족한 메뉴가 있어요':'판매 수량보다 재고가 부족해요'}</h2><p>재고를 확인하거나 그대로 ${start?'영업을 시작':'판매'}할 수 있어요.</p><div class="warning-list">${items}</div><div class="sheet-actions"><button class="cancel" data-warning-check>재고 확인</button><button class="apply" data-warning-continue>${start?'그대로 영업 시작':'그대로 판매'}</button></div>`);document.querySelector('[data-warning-check]').onclick=()=>{checkSource=type;setScreen('stock_check')};document.querySelector('[data-warning-continue]').onclick=()=>{closeSheet();if(start){salesState='open';screen='sales';render();showToast(`영업을 시작했어요 · 확인이 필요한 재고 ${shortageCount()}개`)}else completeSale()}}

    function completeSale(){saleRecorded=true;salesState='open';screen='sales';render();showToast('판매를 기록했어요 · 부족분은 음수 재고로 반영돼요')}

    function stateAction(action){if(action==='manage'){const isBreak=salesState==='break';openSheet(`<h2>${isBreak?'브레이크 중':'영업 중'}</h2><div class="sheet-menu"><button data-manage-action="${isBreak?'resume':'break'}">${isBreak?'영업 재개':'브레이크 타임'}</button><button class="danger" data-manage-action="end">영업 종료</button></div><div class="sheet-actions single"><button class="cancel" data-close>닫기</button></div>`);document.querySelector('[data-close]').onclick=closeSheet;document.querySelectorAll('[data-manage-action]').forEach(b=>b.onclick=()=>{const next=b.dataset.manageAction;closeSheet();stateAction(next)});return}if(action==='start'){if(shortageCount()>0)openStockWarning('start');else{salesState='open';render()}return}if(action==='resume'){salesState='open';render();return}if(action==='break'){salesState='break';render();return}if(action==='end'){openSheet(`<h2>오늘 영업을 종료할까요?</h2><p>직접 종료해도 빠뜨린 판매는 지난달 1일부터 추가하거나 수정할 수 있어요.</p><div class="sheet-actions"><button class="cancel" data-close>취소</button><button class="apply" data-confirm-end>영업 종료</button></div>`);document.querySelector('[data-close]').onclick=closeSheet;document.querySelector('[data-confirm-end]').onclick=()=>{salesState='closedManual';closeSheet();render()}}}

    function openAllLow(){const keys=[...new Set(recipeShortages.flatMap(recipe=>unresolvedKeys(recipe)))];const rows=keys.map(key=>{const item=ingredients[key];const exhausted=item.current.startsWith('−')||item.current.startsWith('0');return `<div class="warning-item"><span><b>${item.name}</b><small>현재 ${item.current} · 안전재고 ${item.safe}</small></span><strong>${exhausted?'소진':'소진 임박'}</strong></div>`}).join('');openSheet(`<h2>전체 부족 재고</h2><p>안전재고 이하인 식재료예요.</p><div class="warning-list">${rows}</div><div class="sheet-actions single"><button class="cancel" data-close>닫기</button></div>`);document.querySelector('[data-close]').onclick=closeSheet}

    function purchaseOptions(){const item=ingredients[selectedIngredient];openSheet(`<h2>구매한 곳 선택</h2><p>구매 링크 옵션은 선택하지 않아도 등록할 수 있어요.</p><div class="sheet-menu"><button data-close>${item.purchase}</button><button data-close>선택 안 함</button></div>`);document.querySelectorAll('[data-close]').forEach(b=>b.onclick=closeSheet)}

    function saveStock(){const quantity=Number($('stock-quantity')?.value||0);const amount=Number(($('stock-amount')?.value||'').replaceAll(',',''));if(quantity<=0||amount<=0){showToast('추가 수량과 구매 금액을 입력해 주세요');return}const item=ingredients[selectedIngredient];resolvedIngredients.add(selectedIngredient);showToast(`${item.name} 재고를 추가했어요`);setTimeout(()=>setScreen('stock_check'),650)}

    function hoursSheet(){
      openSheet(`<h2>영업시간</h2><div class="sheet-meta">종료 시각이 시작보다 이르면 다음 날로 계산돼요.</div><div class="sheet-section">시간</div><div class="time-fields"><label class="field">영업 시작<input type="time" step="900" value="${openTime}" data-hours-open></label><label class="field">영업 종료<input type="time" step="900" value="${closeTime}" data-hours-close></label></div><div class="sheet-actions"><button class="cancel" data-close>취소</button><button class="apply" data-hours-apply>적용</button></div>`);
      document.querySelector('[data-close]').onclick=closeSheet;
      document.querySelector('[data-hours-apply]').onclick=()=>{
        const nextOpen=document.querySelector('[data-hours-open]').value||openTime;
        const nextClose=document.querySelector('[data-hours-close]').value||closeTime;
        if(nextOpen===nextClose){showToast('영업 시작과 종료 시각은 달라야 해요');return}

      if(!pastHasRecord())return `${switcher}<section class="card day-summary"><div class="summary-row"><span>영업일</span><b>${pastDate()}</b></div></section><section class="card past-empty">판매 내역이 없습니다.</section>`;
      const totals=pastTotals();
      const menuRows=pastMenuDefinitions.map(menu=>{const channels=pastChannelSales[pastCase][menu.key];const count=channelTotal(channels);if(!count)return'';return `<div class="menu-row"><span class="menu-copy"><strong>${menu.name}</strong><small>${count}개 · ${channelBreakdown(channels)}</small></span><span class="menu-value"><b>${formatWon(count*menu.price)}</b></span></div>`}).join('');
      const other=pastOtherSales[pastCase]?`<div class="section">기타 매출</div><section class="card"><div class="menu-row"><span class="menu-copy"><strong>기타 매출</strong></span><span class="menu-value"><b>${formatWon(pastOtherSales[pastCase])}</b></span></div></section>`:'';
      const expense=pastExtraExpense[pastCase]?`<div class="section">추가 지출</div><section class="card"><div class="menu-row"><span class="menu-copy"><strong>추가 지출</strong></span><span class="menu-value"><b>−${formatWon(pastExtraExpense[pastCase])}</b></span></div></section>`:'';
      return `${switcher}<section class="card day-summary"><div class="summary-row"><span>영업일</span><b>${pastDate()}</b></div><div class="summary-row"><span>상태</span><b><span class="pill gray">영업 종료</span></b></div><div class="summary-row"><span>판매 수량</span><b>${totals.quantity}개</b></div><div class="summary-row"><span>매출 합계</span><b>${formatWon(totals.totalSales)}</b></div></section><div class="section">메뉴 매출</div><section class="card">${menuRows||'<div class="past-detail-note">기록된 메뉴 판매가 없습니다.</div>'}</section>${other}${expense}`;
    }

    function unifiedPastEntryScreen(){if(!pastEditDraft)pastEditDraft=createPastEditDraft();return `<section class="card day-summary"><div class="summary-row"><span>영업일</span><b>${pastDate()}</b></div></section>${entryActionButtons('past')}<div class="past-entry-toolbar"><button class="past-sort" type="button">판매량순⌄</button><button class="past-menu-manage" type="button">메뉴 관리</button></div><section class="card past-entry-card">${entryMenuRows(pastMenuDefinitions,activePastChannels(),'data-past-sale')}</section>`}

    function bindEntryControls(scope){const attribute=scope==='past'?'data-past-sale':'data-live-sale';document.querySelectorAll(`[${attribute}]`).forEach(button=>button.onclick=()=>openChannelEditor(scope,button.getAttribute(attribute)));document.querySelectorAll('[data-entry-amount]').forEach(button=>button.onclick=()=>openAmountEditor(scope,button.dataset.entryAmount))}
    function syncUnifiedSaleEntryUi(){if(screen!=='sale_entry')return;bindEntryControls('live')}
    function syncUnifiedPastUi(){
      if(screen!=='past')return;
      const hasRecord=pastHasRecord();
      $('header-action').textContent='';
      $('header-action').onclick=null;
      $('title').textContent=pastEditing?(hasRecord?'판매 내역 수정':'판매 내역 추가'):'매출 상세';
      $('content').classList.add('with-footer');
      $('footer').innerHTML=`<footer class="footer"><button class="primary" type="button" data-past-footer>${pastEditing?'판매 내역 저장':hasRecord?'판매 내역 수정':'판매 내역 추가'}</button></footer>`;
      document.querySelector('[data-past-footer]').onclick=()=>{
        if(!pastEditing){pastEditDraft=createPastEditDraft();pastEditing=true;render();return}
        const finish=()=>{pastChannelSales[pastCase]=cloneChannelMap(pastEditDraft.channels);pastOtherSales[pastCase]=pastEditDraft.other;pastExtraExpense[pastCase]=pastEditDraft.expense;if(pastCase==='missing')pastMissingSaved=true;pastEditDraft=null;pastEditing=false;closeSheet();render();showToast('판매 내역을 저장했어요')};
        if(pastCase==='missing'&&!pastMissingSaved){openSheet('<h2>현재 기준으로 기록할까요?</h2><p>당시 기록이 없어 현재 판매가와 원가를 기준으로 저장해요.</p><div class="sheet-actions"><button class="cancel" data-close>취소</button><button class="apply" data-past-confirm>저장</button></div>');document.querySelector('[data-close]').onclick=closeSheet;document.querySelector('[data-past-confirm]').onclick=finish}else finish()
      };
      if(pastEditing){bindEntryControls('past');$('back').onclick=()=>{pastEditDraft=null;pastEditing=false;render()}}
    }
    const originalSetScreen=setScreen;
    setScreen=next=>{if(next==='stock_add'&&stockStateIngredient!==selectedIngredient)resetUnifiedStockState();originalSetScreen(next)};
    const originalBind=bind;
    bind=()=>{originalBind();bindUnifiedStockAdd()};
    purchaseOptions=unifiedPurchaseOptions;
    saveStock=unifiedSaveStock;
    stockAddScreen=unifiedStockAddScreen;
    saleEntryScreen=unifiedSaleEntryScreen;
    pastScreen=unifiedPastScreen;
    if(stockStateIngredient!==selectedIngredient)resetUnifiedStockState();
    const originalRender=render;
    render=()=>{originalRender();syncUnifiedSaleEntryUi();syncUnifiedPastUi()};
    render();
  </script>
</body>
</html>
