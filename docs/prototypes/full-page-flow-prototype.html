      if(id==='stock_event_more'||id==='stock_event_revert'){const type=['입고','차감','폐기'].includes(historyFilters.stock.type)?historyFilters.stock.type:'입고';const rows=historyRows('stock',screens.stock);const index=Math.max(0,rows.findIndex(row=>stockActionType(row)===type));openStockEventMore(index,type);if(id==='stock_event_revert')document.querySelector('[data-stock-event-revert]')?.click();return}
      if(id==='purchase_period')return openHistoryFilter('purchase','period');
      if(id==='ingredient_change_detail'||id==='recipe_change_detail')return openDetail(0);
      if(id==='fixed_period')return openFixedPeriod();
      if(id==='sales_period')return openSalesPeriod();
      if(id==='sales_direct_period'){openSalesPeriod();return openDirectSalesPeriod()}
      if(id==='expense_add')return openExpenseAdd();
      if(id==='expense_delete'){if(!salesExpenseRows.length)salesExpenseRows=[['주방 소모품','프로토타입 예시',32000]];render();return openExpenseDelete(0)}
      if(id==='stock_confirm'||id==='stock_error'){
        stockChangeMode='inbound';
        stockAddOption={mode:'saved',label:'고춧가루 1kg',meta:'식자재쇼핑몰 · 28,000원 · 28.00원/g',volume:1000,paid:28000};
        render();
        document.querySelector('[data-stock-save]')?.click();
        if(id==='stock_error')document.querySelector('[data-stock-confirm]')?.click();
      }
    }
    function setScreen(k){const from=active;if(k==='discard'){historyFilters.stock.type='폐기';historyFilters.stock.discardType='전체';k='stock'}if(!screens[k])k='ingredient_main';if(['recipe_ingredient_search','recipe_material_search','recipe_avg_sales'].includes(k)&&['recipe_add','recipe_edit'].includes(from))parentScreens[k]=from;optionEditIndex=null;activePopup=null;active=k;if(k==='ingredient_detail')ingredientOptionState='filled';$('overlay').classList.remove('open');history.replaceState(null,'',`${location.pathname}?screen=${k}`);render();$('content').scrollTop=0}
    function stockPurchaseReady(){return stockAddOption.mode==='saved'||(stockAddOption.mode==='direct'&&stockAddVendor.trim().length>0)}
    const purchasePlaceTitleObserver=new MutationObserver(()=>{
      const body=$('sheet-body');
      const heading=body.querySelector('h2');
      if(heading?.textContent==='구매 링크 선택')heading.textContent='구매처 선택';
      const section=[...body.querySelectorAll('.sheet-section')].find(item=>item.textContent.trim()==='저장된 구매 링크');
      section?.remove();
      const optionButtons=[...body.querySelectorAll('[data-stock-option]')];
      const empty=optionButtons.find(button=>button.dataset.stockOption==='0');
      if(empty&&!empty.dataset.stockPlaceFormatted){
        const checked=empty.querySelector('.stock-option-check')?'<span class="stock-option-check">✓</span>':'';
        empty.innerHTML=`<span class="stock-option-copy"><span class="stock-option-empty">미 선택</span></span>${checked}`;
        empty.dataset.stockPlaceFormatted='true';
      }
      optionButtons.filter(button=>['1','2'].includes(button.dataset.stockOption)&&!button.dataset.stockPlaceFormatted).forEach(button=>{
        const name=button.querySelector('strong')?.textContent.trim()||'';
        const meta=(button.querySelector('small')?.textContent||'').split(' · ');
        const vendor=meta.shift()||'';
        const price=meta.shift()||'';
        const unitPrice=meta.join(' · ');
        const checked=button.querySelector('.stock-option-check')?'<span class="stock-option-check">✓</span>':'';
        button.innerHTML=`<span class="stock-option-copy"><span class="stock-purchase-title"><span>${vendor}</span><strong>· ${name}</strong></span><small class="stock-purchase-meta"><b>${price}</b>${unitPrice?`<span>· ${unitPrice}</span>`:''}</small></span>${checked}`;
        button.dataset.stockPlaceFormatted='true';
      });
      if(body.querySelector('.stock-option-actions'))return;
      const direct=[...body.querySelectorAll('[data-stock-option]')].find(button=>button.textContent.includes('직접 입력'));
      const add=body.querySelector('[data-stock-option-new]');
      if(!direct||!add)return;
      const actions=document.createElement('div');
      actions.className='stock-option-actions';
      direct.className='stock-option-action';
      direct.innerHTML='<span>＋ 직접 입력</span>';
      add.className='stock-option-action primary-lite';
      add.innerHTML='<span>＋ 구매 링크 추가</span>';
      direct.before(actions);
      actions.append(direct,add);
    });
    purchasePlaceTitleObserver.observe($('sheet-body'),{childList:true,subtree:true});
    function normalizeCalculatedResults(root=document){
      root.querySelectorAll('.stock-total-card:not(.stock-result-value-card)').forEach(card=>{
        const rows=[...card.querySelectorAll(':scope > .stock-total-result')].filter(row=>row.querySelector(':scope > span')&&row.querySelector(':scope > strong'));
        if(!rows.length)return;
        const group=document.createElement('div');
        group.className=`stock-result-group${card.classList.contains('form-result')?' form-result':''}`;
        rows.forEach(row=>{
          const label=row.querySelector(':scope > span');
          const field=document.createElement('div');
          field.className='stock-result-field';
          const fieldLabel=document.createElement('span');
          fieldLabel.className='stock-add-label stock-result-label';
          fieldLabel.textContent=label.textContent;
          label.remove();
          const valueCard=document.createElement('div');
          valueCard.className=[...card.classList].filter(name=>name!=='form-result').concat('stock-result-value-card').join(' ');
          valueCard.append(row);
          field.append(fieldLabel,valueCard);
          group.append(field);
        });
        card.replaceWith(group);
      });
    }
    const calculationCardObserver=new MutationObserver(()=>normalizeCalculatedResults(document));
    calculationCardObserver.observe($('content'),{childList:true,subtree:true});
    calculationCardObserver.observe($('sheet-body'),{childList:true,subtree:true});
    function bindRequiredDeductReason(){
      if(active!=='stock_change'||stockChangeMode!=='deduct')return;
      const input=document.querySelector('[data-stock-deduct-reason]');
      const save=$('bottom-action').querySelector('.primary');
      if(!input||!save||input.dataset.requiredBound)return;
      const sync=()=>{save.disabled=input.value.trim().length===0};
      input.dataset.requiredBound='true';
      input.addEventListener('input',sync);
      sync();
    }
    const deductReasonObserver=new MutationObserver(bindRequiredDeductReason);
    deductReasonObserver.observe($('content'),{childList:true,subtree:true});
    deductReasonObserver.observe($('bottom-action'),{childList:true,subtree:true});
    function enforceRequiredOptionVendor(){if(active!=='options'||optionEditIndex===null)return;const field=document.querySelector('[data-vendor-picker="option"],[data-option-vendor-new]');const label=field?.closest('.edit-form-row')?.querySelector('.edit-form-label>span:first-child');if(label&&label.textContent.trim()!=='구매처 *')label.innerHTML='구매처 <em>*</em>';if(field?.matches('[data-option-vendor-new]')){field.required=true;field.setAttribute('aria-required','true')}const save=document.querySelector('[data-option-save]');if(save)save.disabled=!optionFormReady()}
    const optionVendorRequiredObserver=new MutationObserver(enforceRequiredOptionVendor);
    optionVendorRequiredObserver.observe($('content'),{childList:true,subtree:true});
    optionVendorRequiredObserver.observe($('bottom-action'),{childList:true,subtree:true});
    $('content').addEventListener('input',event=>{if(event.target.matches('[data-option-vendor-new]'))optionVendorDraft=event.target.value;if(event.target.matches('[data-option-url]'))optionUrl=event.target.value;if(event.target.matches('[data-option-vendor-new],[data-option-url]'))enforceRequiredOptionVendor()});
    function bindOptionCardMenus(){document.querySelectorAll('[data-option-card-menu]:not([data-card-menu-bound])').forEach(button=>{button.dataset.cardMenuBound='true';button.addEventListener('click',()=>openOptionCardMenu(Number(button.dataset.optionCardMenu)))})}
    const optionCardMenuObserver=new MutationObserver(bindOptionCardMenus);
    optionCardMenuObserver.observe($('content'),{childList:true,subtree:true});
    function bindStockEventMenus(){document.querySelectorAll('[data-stock-event-more]:not([data-stock-event-bound])').forEach(button=>{button.dataset.stockEventBound='true';button.addEventListener('click',()=>openStockEventMore(Number(button.dataset.stockEventMore),button.dataset.stockEventType))})}
    const stockEventMenuObserver=new MutationObserver(bindStockEventMenus);
    stockEventMenuObserver.observe($('content'),{childList:true,subtree:true});
    function ensureTaxTotalSubtotal(){if(active!=='my_tax')return;const labels=[...document.querySelectorAll('.tax-section-label')];const previewLabel=labels.find(node=>node.textContent.trim()==='판매 금액 미리보기');const previewRows=previewLabel?.nextElementSibling?.querySelectorAll('.tax-summary-row>span');['판매가','세금 총액','결제금액','세금 제외 금액'].forEach((text,index)=>{if(previewRows?.[index]&&previewRows[index].textContent!==text)previewRows[index].textContent=text});const label=labels.find(node=>node.textContent.trim()==='세금 총액');const card=label?.nextElementSibling;if(!card||card.querySelector('.tax-total-subtotal'))return;const totals=taxPreviewTotals();card.insertAdjacentHTML('beforeend',`<div class="subtotal tax-total-subtotal"><span>합계</span><b>${taxMoney(totals.amount)}<small>${totals.rate.toFixed(1)}%</small></b></div>`)}
    const taxTotalSubtotalObserver=new MutationObserver(ensureTaxTotalSubtotal);
    taxTotalSubtotalObserver.observe($('content'),{childList:true,subtree:true});
    function bindRecipeCostTabs(){document.querySelectorAll('.recipe-cost-tabs button:not([data-recipe-tab-bound])').forEach(button=>{button.dataset.recipeTabBound='true';button.addEventListener('click',()=>{button.parentElement.querySelectorAll('button').forEach(item=>item.classList.remove('active'));button.classList.add('active')})})}
    const recipeCostTabsObserver=new MutationObserver(bindRecipeCostTabs);
    recipeCostTabsObserver.observe($('content'),{childList:true,subtree:true});
    $('overlay').onclick=e=>{if(e.target===$('overlay'))$('overlay').classList.remove('open')};
    $('back').onclick=()=>{if(active==='options'&&optionEditIndex!==null){optionEditIndex=null;render();$('content').scrollTop=0;return}if(parentScreens[active])setScreen(parentScreens[active])};
    const initialParams=new URLSearchParams(location.search);const initialPopup=initialParams.get('popup');setScreen(initialParams.get('screen')||'ingredient_main');if(initialPopup&&(popupTabs[active]||[]).some(item=>item[0]===initialPopup))openPopupTab(initialPopup);
  </script>
