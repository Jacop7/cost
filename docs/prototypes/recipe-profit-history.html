<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>레시피 손익 변동 · 단순형</title>
  <style>
    :root {
      --canvas: #e9edf1;
      --app: #f2f4f6;
      --surface: #ffffff;
      --surface-soft: #f7f8fa;
      --ink: #191f28;
      --sub: #4e5968;
      --muted: #8b95a1;
      --line: #e5e8eb;
      --line-soft: #f2f4f6;
      --green: #168f63;
      --red: #f04452;
      --scrim: rgba(0, 0, 0, .44);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 24px 12px 46px;
      color: var(--ink);
      background: var(--canvas);
      font-family: Pretendard, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    button { font: inherit; }
    .workspace { width: min(410px, 100%); margin: 0 auto; }
    .prototype-label { margin: 0 5px 10px; color: var(--sub); font-size: 13px; font-weight: 700; }

    .phone {
      position: relative;
      height: min(820px, calc(100vh - 78px));
      min-height: 660px;
      overflow: hidden;
      border: 1px solid rgba(25, 31, 40, .1);
      border-radius: 30px;
      background: var(--surface);
      box-shadow: 0 22px 60px rgba(25, 31, 40, .14);
    }

    .status-bar {
      height: 28px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 19px;
      background: var(--surface);
      font-size: 11px;
      font-weight: 800;
    }

    .app-header {
      height: 56px;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 0 15px;
      background: var(--surface);
    }

    .back {
      width: 26px;
      border: 0;
      padding: 0;
      color: var(--ink);
      background: transparent;
      font-size: 28px;
      line-height: 1;
      cursor: pointer;
    }

    .app-title { flex: 1; font-size: 18px; font-weight: 800; }

    .screen {
      height: calc(100% - 84px);
      overflow-y: auto;
      padding: 14px 14px 30px;
      background: var(--app);
      scrollbar-width: thin;
    }

    .month { margin: 0 6px 8px; color: var(--sub); font-size: 13px; font-weight: 800; }

    .history-list {
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: var(--surface);
      box-shadow: 0 1px 3px rgba(0, 0, 0, .03);
    }

    .history-row {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 9px;
      padding: 14px;
      border: 0;
      border-top: 1px solid var(--line-soft);
      color: var(--ink);
      background: var(--surface);
      text-align: left;
      cursor: pointer;
    }

    .history-row:first-child { border-top: 0; }
    .history-row:active { background: var(--surface-soft); }
    .history-copy { min-width: 0; flex: 1; }
    .history-date { display: block; color: var(--muted); font-size: 12px; font-weight: 700; }
    .history-title { display: block; margin-top: 4px; font-size: 15px; font-weight: 800; }
    .history-reason { display: block; overflow: hidden; margin-top: 4px; color: var(--sub); font-size: 12px; font-weight: 650; text-overflow: ellipsis; white-space: nowrap; }

    .history-result { flex: 0 0 auto; max-width: 112px; text-align: right; }
    .history-result strong { display: block; font-size: 15px; font-weight: 800; white-space: nowrap; }
    .history-result small { display: block; margin-top: 4px; font-size: 12px; font-weight: 800; }
    .up { color: var(--green); }
    .down { color: var(--red); }
    .chevron { flex: 0 0 auto; color: #b0b8c1; font-size: 22px; }

    .overlay {
      position: absolute;
      z-index: 30;
      inset: 0;
      display: none;
      align-items: flex-end;
      background: var(--scrim);
    }

    .overlay.open { display: flex; }

    .sheet {
      width: 100%;
      max-height: 80%;
      overflow-y: auto;
      padding: 10px 14px 18px;
      border-radius: 22px 22px 0 0;
      background: var(--surface);
    }

    .handle { width: 40px; height: 5px; margin: 0 auto 14px; border-radius: 3px; background: var(--line); }
    .sheet-head { padding: 4px 3px 10px; }
    .sheet-head h2 { margin: 0; font-size: 19px; font-weight: 800; }
    .sheet-head p { margin: 5px 0 0; color: var(--muted); font-size: 12px; font-weight: 700; }
    .group-title { margin: 16px 3px 8px; color: var(--sub); font-size: 13px; font-weight: 800; }

    .change-group {
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 13px;
    }

    .change-row {
      display: grid;
      grid-template-columns: minmax(64px, 1fr) auto 14px auto;
      align-items: center;
      gap: 6px;
      padding: 11px 12px;
      border-top: 1px solid var(--line-soft);
      font-size: 13px;
    }

    .change-row:first-child { border-top: 0; }
    .change-label { color: var(--sub); font-weight: 700; }
    .change-before { color: var(--muted); font-weight: 700; text-align: right; white-space: nowrap; }
    .change-arrow { color: #b0b8c1; text-align: center; }
    .change-after { font-weight: 800; text-align: right; white-space: nowrap; }

    .close {
      width: 100%;
      margin-top: 13px;
      padding: 15px;
      border: 0;
      border-radius: 12px;
      color: var(--ink);
      background: var(--surface-soft);
      font-size: 15px;
      font-weight: 800;
      cursor: pointer;
    }

    @media (max-width: 430px) {
      body { padding: 0; background: var(--surface); }
      .workspace { width: 100%; }
      .prototype-label { display: none; }
      .phone { height: 100vh; min-height: 620px; border: 0; border-radius: 0; box-shadow: none; }
    }

    @media (max-width: 350px) {
      .history-result { max-width: 96px; }
      .change-row { grid-template-columns: minmax(55px, 1fr) auto 10px auto; padding-inline: 10px; font-size: 12px; }
    }
  </style>
</head>
<body>
  <main class="workspace">
    <p class="prototype-label">목록을 누르면 변동 원인과 손익 결과만 표시됩니다.</p>

    <article class="phone" aria-label="제육볶음 손익 변동">
      <div class="status-bar"><span>9:41</span><span>● ◔ ▰</span></div>
      <header class="app-header">
        <button class="back" type="button" aria-label="뒤로">‹</button>
        <span class="app-title">손익 변동</span>
      </header>

      <div class="screen">
        <h2 class="month">2026년 8월</h2>
        <section class="history-list" aria-label="손익 변동 목록">
          <button class="history-row" type="button" data-event="ingredient">
            <span class="history-copy">
              <span class="history-date">08/20 · 14:41</span>
              <span class="history-title">고춧가루 단가 반영</span>
              <span class="history-reason">재료비 32원 감소</span>
            </span>
            <span class="history-result"><strong>4,046.69원</strong><small class="up">+32원</small></span>
            <span class="chevron">›</span>
          </button>

          <button class="history-row" type="button" data-event="fixed">
            <span class="history-copy">
              <span class="history-date">08/18 · 16:02</span>
              <span class="history-title">고정지출 반영</span>
              <span class="history-reason">고정지출 36원 증가</span>
            </span>
            <span class="history-result"><strong>4,014.69원</strong><small class="down">-36원</small></span>
            <span class="chevron">›</span>
          </button>

          <button class="history-row" type="button" data-event="recipe">
            <span class="history-copy">
              <span class="history-date">08/15 · 10:12</span>
              <span class="history-title">레시피 수정</span>
              <span class="history-reason">판매가 500원 증가</span>
            </span>
            <span class="history-result"><strong>4,050.69원</strong><small class="up">+299.54원</small></span>
            <span class="chevron">›</span>
          </button>

        </section>
      </div>

      <div class="overlay" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
        <section class="sheet">
          <div class="handle"></div>
          <div class="sheet-head">
            <h2 id="sheet-title"></h2>
            <p id="sheet-meta"></p>
          </div>

          <div id="modern-detail">
            <h3 class="group-title">변동 원인</h3>
            <div class="change-group" id="cause-group"></div>
            <h3 class="group-title">손익 결과</h3>
            <div class="change-group" id="result-group"></div>
          </div>

          <button class="close" type="button">닫기</button>
        </section>
      </div>
    </article>
  </main>

  <script>
    const events = {
      ingredient: {
        title: '고춧가루 단가 반영',
        meta: '2026.08.20 14:41 · 고춧가루',
        cause: ['재료비', '2,838.40원', '2,806.40원'],
        result: [
          ['순이익', '4,014.69원', '4,046.69원'],
          ['순이익률', '33.46%', '33.72%'],
        ],
      },
      fixed: {
        title: '고정지출 반영',
        meta: '2026.08.18 16:02 · 고정지출 설정',
        cause: ['고정지출', '3,720원', '3,756원'],
        result: [
          ['순이익', '4,050.69원', '4,014.69원'],
          ['순이익률', '33.76%', '33.46%'],
        ],
      },
      recipe: {
        title: '레시피 수정',
        meta: '2026.08.15 10:12 · 직접 수정',
        cause: ['판매가', '11,500원', '12,000원'],
        result: [
          ['순이익', '3,751.15원', '4,050.69원'],
          ['순이익률', '32.62%', '33.76%'],
        ],
      },
    };

    const overlay = document.querySelector('.overlay');
    const title = document.getElementById('sheet-title');
    const meta = document.getElementById('sheet-meta');
    const modernDetail = document.getElementById('modern-detail');
    const causeGroup = document.getElementById('cause-group');
    const resultGroup = document.getElementById('result-group');

    function rowHtml([label, before, after]) {
      return `<div class="change-row"><span class="change-label">${label}</span><span class="change-before">${before}</span><span class="change-arrow">→</span><span class="change-after">${after}</span></div>`;
    }

    function openEvent(key) {
      const event = events[key];
      if (!event) return;
      title.textContent = event.title;
      meta.textContent = event.meta;
      causeGroup.innerHTML = rowHtml(event.cause);
      resultGroup.innerHTML = event.result.map(rowHtml).join('');
      modernDetail.style.display = 'block';
      overlay.classList.add('open');
    }

    function closeSheet() {
      overlay.classList.remove('open');
    }

    document.querySelectorAll('.history-row').forEach((row) => {
      row.addEventListener('click', () => openEvent(row.dataset.event));
    });
    document.querySelector('.close').addEventListener('click', closeSheet);
    overlay.addEventListener('click', (event) => {
      if (event.target === overlay) closeSheet();
    });
    document.addEventListener('keydown', (event) => {
      if (event.key === 'Escape') closeSheet();
    });

    const previewEvent = new URLSearchParams(window.location.search).get('event');
    if (previewEvent && events[previewEvent]) openEvent(previewEvent);
  </script>
</body>
</html>
