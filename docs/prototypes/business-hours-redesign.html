<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>영업시간 · 영업일 전면 재설계</title>
  <style>
    :root{--bg:#eef1f4;--app:#f2f4f6;--surface:#fff;--surface2:#f9fafb;--ink:#191f28;--sub:#4e5968;--ter:#8b95a1;--line:#e5e8eb;--line2:#eceff2;--blue:#3182f6;--blue2:#eaf3ff;--green:#0e9f6e;--green2:#e8f8f1;--amber:#b76e00;--amber2:#fff4df;--red:#f04452;--red2:#fff0f1}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;padding:22px 14px 40px;background:var(--bg);color:var(--ink);font-family:Pretendard,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}button,input{font:inherit}.workspace{width:min(960px,100%);margin:auto}.catalog{width:min(720px,100%);margin:0 auto 14px;padding:14px;border:1px solid rgba(25,31,40,.08);border-radius:18px;background:rgba(255,255,255,.86)}.catalog-head{display:flex;align-items:center;gap:10px;margin-bottom:11px}.catalog-head h1{margin:0;font-size:17px}.catalog-head span{margin-left:auto;color:var(--ter);font-size:12px;font-weight:700}.nav,.scenarios{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}.scenarios{margin-top:8px;padding-top:8px;border-top:1px solid var(--line)}.nav button,.scenarios button{flex:0 0 auto;min-height:35px;padding:7px 11px;border:0;border-radius:9px;background:transparent;color:var(--sub);font-size:13px;font-weight:750;cursor:pointer;white-space:nowrap}.nav button.on{background:var(--ink);color:#fff}.scenarios button.on{background:var(--surface);color:var(--blue);box-shadow:0 2px 9px rgba(25,31,40,.09)}
    .phone{position:relative;width:min(390px,100%);height:min(820px,calc(100vh - 204px));min-height:640px;margin:auto;overflow:hidden;border:1px solid rgba(25,31,40,.11);border-radius:30px;background:var(--app);box-shadow:0 24px 72px rgba(25,31,40,.15)}.statusbar{height:26px;display:flex;align-items:center;justify-content:space-between;padding:0 19px;background:#fff;font-size:11px;font-weight:800}.header{height:56px;display:flex;align-items:center;padding:0 15px;background:#fff}.back{width:30px;padding:0;border:0;background:transparent;color:var(--ink);font-size:29px;line-height:1;text-align:left}.title{font-size:18px;font-weight:850}.header-action{margin-left:auto;border:0;background:transparent;color:var(--blue);font-size:14px;font-weight:800}.content{height:calc(100% - 82px);overflow-y:auto;padding:12px 16px 30px;scrollbar-width:thin}.content.with-footer{padding-bottom:92px}.card{overflow:hidden;margin-bottom:11px;border:1px solid var(--line);border-radius:14px;background:#fff}.row{display:flex;align-items:center;gap:10px;min-height:49px;padding:11px 14px;border-bottom:1px solid var(--line2)}.row:last-child{border-bottom:0}.row>span:first-child{min-width:0;flex:1;color:var(--sub);font-size:15px;font-weight:700}.row b{font-size:15px;font-variant-numeric:tabular-nums}.row small{display:block;margin-top:3px;color:var(--ter);font-size:12px;font-weight:700}.section{margin:15px 2px 8px;color:var(--sub);font-size:13px;font-weight:800}.section:first-child{margin-top:0}.chev{color:var(--ter);font-size:18px}.pill{display:inline-flex;align-items:center;padding:4px 7px;border-radius:7px;font-size:11px;font-weight:850}.pill.green{background:var(--green2);color:var(--green)}.pill.amber{background:var(--amber2);color:var(--amber)}.pill.gray{background:var(--surface2);color:var(--sub)}.pill.red{background:var(--red2);color:var(--red)}
    .pill.closed{background:var(--line);color:var(--sub)}
    .day-state{padding:14px}.state-top{display:flex;align-items:center;gap:8px}.state-top strong{font-size:17px}.state-info{display:flex;align-items:baseline;gap:8px;min-width:0}.state-date{display:inline-flex;align-items:baseline;gap:2px;color:var(--ink);font-size:14px;white-space:nowrap}.state-date strong{font-size:14px;font-weight:850}.state-date small{color:var(--ter);font-size:12px;font-weight:700}.state-hours{color:var(--ter);font-size:12px;font-weight:700;white-space:nowrap}.state-actions{display:flex;gap:6px;margin-left:auto}.state-actions button{min-height:34px;padding:7px 9px;border:0;border-radius:9px;background:var(--surface2);color:var(--sub);font-size:12px;font-weight:800;white-space:nowrap}.state-actions button.primary-small{background:var(--blue);color:#fff}.status-select{margin-left:auto;border:1px solid var(--blue);background:var(--blue);color:#fff;cursor:pointer}.drop-caret{display:inline-block;margin-left:4px;font-size:11px}.state-copy{margin-top:8px;color:var(--sub);font-size:14px;font-weight:650;line-height:20px}.state-meta{margin-top:5px;color:var(--ter);font-size:12px;font-weight:700}.state-open{border-color:#bfe8d8}.state-break{border-color:#f2d49c;background:#fffdfa}.state-closed{background:var(--surface2)}.hero{padding:16px;background:var(--blue);color:#fff}.hero small{font-size:13px;font-weight:700;opacity:.82}.hero b{display:block;margin-top:7px;font-size:25px}.hero span{display:block;margin-top:4px;font-size:13px;font-weight:700;opacity:.86}.menu-row{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line2)}.menu-row:last-child{border-bottom:0}.menu-copy{min-width:0;flex:1}.menu-copy strong{display:block;font-size:15px}.menu-copy small{display:block;margin-top:3px;color:var(--ter);font-size:12px}.menu-value{text-align:right}.menu-value b{display:block;font-size:15px}.menu-value small{display:block;margin-top:3px;color:var(--ter);font-size:12px}.primary-small{border:0;border-radius:9px;background:var(--blue)!important;color:#fff!important}
    .segmented{display:grid;grid-template-columns:repeat(2,1fr);gap:3px;padding:3px;border-radius:11px;background:#e9edf1}.segmented button{min-height:38px;border:0;border-radius:8px;background:transparent;color:var(--sub);font-size:13px;font-weight:800}.segmented button.on{background:#fff;color:var(--ink);box-shadow:0 1px 5px rgba(25,31,40,.08)}.timezone{display:flex;align-items:center;gap:10px;padding:13px 14px}.timezone-copy{min-width:0;flex:1}.timezone-copy strong{display:block;font-size:15px}.timezone-copy small{display:block;margin-top:3px;color:var(--ter);font-size:12px}.schedule-head{display:flex;align-items:center;padding:12px 14px;background:var(--surface2);border-bottom:1px solid var(--line2)}.schedule-head strong{font-size:15px}.schedule-head span{margin-left:auto;color:var(--ter);font-size:12px;font-weight:700}.time-row{width:100%;display:flex;align-items:center;gap:10px;min-height:54px;padding:11px 14px;border:0;border-bottom:1px solid var(--line2);background:#fff;text-align:left}.time-row:last-child{border-bottom:0}.time-label{min-width:0;flex:1;color:var(--sub);font-size:15px;font-weight:700}.time-value{text-align:right}.time-value b{display:block;font-size:15px}.time-value small{display:block;margin-top:3px;color:var(--blue);font-size:11px;font-weight:800}.weekday-row{display:grid;grid-template-columns:38px 1fr auto;align-items:center;gap:8px;min-height:49px;padding:8px 14px;border-bottom:1px solid var(--line2)}.weekday-row:last-child{border-bottom:0}.weekday-row strong{font-size:14px}.weekday-row span{color:var(--sub);font-size:14px;font-weight:700}.weekday-row button{border:0;background:transparent;color:var(--blue);font-size:13px;font-weight:800}.policy{padding:13px 14px}.policy strong{display:block;font-size:15px}.policy p{margin:5px 0 0;color:var(--sub);font-size:13px;line-height:19px}.footer{position:absolute;right:0;bottom:0;left:0;padding:11px 16px 18px;border-top:1px solid var(--line);background:rgba(255,255,255,.97)}.primary{width:100%;height:50px;border:0;border-radius:12px;background:var(--blue);color:#fff;font-size:16px;font-weight:850}
    .day-summary{padding:3px 14px}.summary-row{display:flex;align-items:center;gap:10px;min-height:49px;border-bottom:1px solid var(--line2)}.summary-row:last-child{border-bottom:0}.summary-row span{min-width:0;flex:1;color:var(--sub);font-size:15px;font-weight:700}.summary-row b{font-size:15px}.edit-link{color:var(--blue)!important}.case-switch{display:flex;gap:6px;margin-bottom:9px}.case-switch button{padding:7px 10px;border:1px solid var(--line);border-radius:9px;background:#fff;color:var(--sub);font-size:12px;font-weight:800}.case-switch button.on{border-color:var(--ink);color:var(--ink)}.estimate{padding:13px 14px;border-color:#f2d49c;background:#fffdfa}.estimate strong{display:block;color:var(--amber);font-size:14px}.estimate p{margin:5px 0 0;color:var(--sub);font-size:13px;line-height:19px}
    .overlay{position:absolute;z-index:20;inset:0;display:none;align-items:flex-end;background:rgba(0,0,0,.42)}.overlay.open{display:flex}.sheet{width:100%;max-height:80%;overflow-y:auto;padding:9px 16px 24px;border-radius:22px 22px 0 0;background:#fff}.handle{width:40px;height:5px;margin:0 auto 15px;border-radius:3px;background:var(--line)}.sheet h2{margin:0;font-size:19px}.sheet p{margin:7px 0 0;color:var(--sub);font-size:14px;line-height:20px}.sheet-meta{margin-top:5px;color:var(--ter);font-size:12px;font-weight:700}.sheet-section{margin:18px 0 8px;color:var(--sub);font-size:13px;font-weight:800}.sheet-menu{margin-top:15px;overflow:hidden;border:1px solid var(--line);border-radius:12px}.sheet-menu button{width:100%;height:52px;padding:0 14px;border:0;border-bottom:1px solid var(--line2);background:#fff;color:var(--ink);font-size:15px;font-weight:800;text-align:left}.sheet-menu button:last-child{border-bottom:0}.sheet-menu button.danger{color:var(--red)}.time-fields{display:grid;grid-template-columns:1fr 1fr;gap:8px}.field{display:block;color:var(--sub);font-size:12px;font-weight:700}.field input{width:100%;height:46px;margin-top:6px;padding:0 11px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink);font-size:15px}.day-choice{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:10px}.day-choice button{height:42px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--sub);font-size:13px;font-weight:800}.day-choice button.on{border-color:var(--blue);background:var(--blue2);color:var(--blue)}.sheet-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:18px}.sheet-actions.single{grid-template-columns:1fr}.sheet-actions button{height:48px;border:0;border-radius:12px;font-size:15px;font-weight:850}.cancel{background:var(--surface2);color:var(--ink)}.apply{background:var(--blue);color:#fff}.warning-box{margin-top:14px;padding:12px;border-radius:11px;background:var(--amber2);color:var(--sub);font-size:13px;line-height:19px}.warning-box strong{display:block;margin-bottom:3px;color:var(--amber)}
    .weekday-checks{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;padding:13px}.weekday-checks button{aspect-ratio:1;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--sub);font-size:13px;font-weight:800}.weekday-checks button.on{border-color:var(--blue);background:var(--blue);color:#fff}
    @media(max-width:520px){body{padding:0;background:var(--app)}.catalog{margin:0;border:0;border-radius:0;padding:8px 10px}.catalog-head{display:none}.phone{width:100%;height:calc(100vh - 96px);min-height:600px;border:0;border-radius:0;box-shadow:none}}
  </style>
</head>
<body>
  <main class="workspace">
    <section class="catalog">
      <div class="catalog-head"><h1>영업시간 · 영업일 재설계</h1><span>기획 프로토타입</span></div>
      <nav class="nav" aria-label="화면 선택">
        <button class="on" data-screen="sales">매출 상태</button>
        <button data-screen="hours">영업시간 설정</button>
        <button data-screen="past">과거 매출 수정</button>
      </nav>
      <div class="scenarios" id="scenarios" aria-label="상태 선택"></div>
    </section>

    <section class="phone" aria-label="모바일 앱 화면">
      <div class="statusbar"><span>9:41</span><span>● ◉ ▰</span></div>
      <header class="header"><button class="back" aria-label="뒤로">‹</button><div class="title" id="title">매출관리</div><button class="header-action" id="header-action"></button></header>
      <div class="content" id="content"></div>
      <div id="footer"></div>
      <div class="overlay" id="overlay" role="dialog" aria-modal="true"><section class="sheet"><div class="handle"></div><div id="sheet-body"></div></section></div>
    </section>
  </main>

  <script>
    const $=id=>document.getElementById(id);
    const requestedScreen=new URLSearchParams(location.search).get('screen');
    let screen=['sales','hours','past'].includes(requestedScreen)?requestedScreen:'sales';
    let salesState='open';
    let pastCase='existing';
    let openTime='11:00';
    let closeTime='22:00';
    let nextDay=false;
    let breakEnabled=true;
    let breakStartTime='15:00';
    let breakEndTime='17:00';
    let selectedDays=['월','화','수','목','금','토'];

    const stateData={
      before:{label:'영업 전',tone:'gray',hours:'11:00–22:00',actions:[['start','영업 시작','primary-small']],className:''},
      open:{label:'영업 중',tone:'green',hours:'11:00–22:00',actions:[['manage']],className:'state-open'},
      break:{label:'브레이크 중',tone:'amber',hours:'11:00–22:00',actions:[['manage']],className:'state-break'},
      closedManual:{label:'영업 종료',tone:'closed',hours:'11:00–21:30',actions:[],className:'state-closed'},
      closedAuto:{label:'영업 종료',tone:'closed',hours:'11:00–22:00',actions:[],className:'state-closed'}
    };

    const scenarioButtons=()=>screen==='sales'?Object.entries({before:'영업 전',open:'영업 중',break:'브레이크',closedManual:'영업 종료',closedAuto:'영업 종료 (자동 종료 기간 경과)'}).map(([key,label])=>`<button class="${salesState===key?'on':''}" data-state="${key}">${label}</button>`).join(''):'';

    function salesScreen(){const s=stateData[salesState];const hasManage=s.actions.some(([key])=>key==='manage');const info=`<span class="state-info"><span class="state-date"><strong>8월 24일</strong><small>(월)</small></span><span class="state-hours">${s.hours}</span></span>`;const status=hasManage?`<button class="pill status-select" data-state-action="manage">${s.label}<span class="drop-caret">⌄</span></button>`:s.actions.length?'':`<span class="pill ${s.tone}" style="margin-left:auto">${s.label}</span>`;const actions=hasManage?'':s.actions.length?`<div class="state-actions">${s.actions.map(([key,label,className])=>`<button class="${className}" data-state-action="${key}">${label}</button>`).join('')}</div>`:'';return `<section class="card day-state ${s.className}"><div class="state-top">${info}${status}${actions}</div></section><section class="card hero"><small>오늘 순이익</small><b>94,913원</b><span>매출 529,500원 · 순이익률 17.9%</span></section><div class="section">오늘 판매</div><section class="card"><div class="menu-row"><span class="menu-copy"><strong>제육볶음</strong><small>판매가 12,000원 · 재료비 2,806원</small></span><span class="menu-value"><b>12개</b><small>144,000원</small></span></div><div class="menu-row"><span class="menu-copy"><strong>김치찌개</strong><small>판매가 9,000원 · 재료비 3,264원</small></span><span class="menu-value"><b>11개</b><small>99,000원</small></span></div><div class="menu-row"><span class="menu-copy"><strong>소불고기</strong><small>판매가 14,500원 · 재료비 4,789원</small></span><span class="menu-value"><b>5개</b><small>72,500원</small></span></div></section>`}

    function hoursScreen(){const days=['월','화','수','목','금','토','일'];return `<div class="section">요일 설정</div><section class="card"><div class="weekday-checks">${days.map(day=>`<button class="${selectedDays.includes(day)?'on':''}" data-day-check="${day}" aria-pressed="${selectedDays.includes(day)}">${day}</button>`).join('')}</div></section><div class="section">시간 설정</div><section class="card"><button class="time-row" data-edit-hours><span class="time-label">영업시간</span><span class="time-value"><b>${openTime}–${nextDay?'다음 날 ':''}${closeTime}</b></span><span class="chev">›</span></button><button class="time-row" data-break><span class="time-label">브레이크 타임</span><span class="time-value"><b>${breakEnabled?`${breakStartTime}–${breakEndTime}`:'사용 안 함'}</b></span><span class="chev">›</span></button></section>`}

    function pastScreen(){const missing=pastCase==='missing';return `<div class="case-switch"><button class="${!missing?'on':''}" data-past-case="existing">기록 있는 날짜</button><button class="${missing?'on':''}" data-past-case="missing">기록 없는 날짜</button></div>${missing?'<section class="card estimate"><strong>손익 기준값 없음</strong><p>8월 18일은 영업 기록이 없어 현재 판매가·원가로 추정해야 해요.</p></section>':''}<section class="card day-summary"><div class="summary-row"><span>영업일</span><b>${missing?'8월 18일 (화)':'8월 22일 (토)'}</b></div><div class="summary-row"><span>상태</span><b>${missing?'<span class="pill amber">기록 없음</span>':'<span class="pill gray">영업 종료</span>'}</b></div><div class="summary-row"><span>판매 수량</span><b>${missing?'0개':'37개'}</b></div><div class="summary-row"><span>매출 합계</span><b>${missing?'0원':'529,500원'}</b></div></section><div class="section">메뉴 매출</div><section class="card"><div class="menu-row"><span class="menu-copy"><strong>제육볶음</strong><small>${missing?'기록 없음':'12개 · 매장 10 · 배달 1 · 포장 1'}</small></span><span class="menu-value"><b>${missing?'—':'144,000원'}</b></span></div><div class="menu-row"><span class="menu-copy"><strong>김치찌개</strong><small>${missing?'기록 없음':'11개 · 매장 5 · 배달 4 · 포장 2'}</small></span><span class="menu-value"><b>${missing?'—':'99,000원'}</b></span></div></section>`}

    function openSheet(html){$('sheet-body').innerHTML=html;$('overlay').classList.add('open')}
    function closeSheet(){$('overlay').classList.remove('open')}

    function stateAction(action){if(action==='manage'){const isBreak=salesState==='break';openSheet(`<h2>${isBreak?'브레이크 중':'영업 중'}</h2><div class="sheet-menu"><button data-manage-action="${isBreak?'resume':'break'}">${isBreak?'영업 재개':'브레이크 타임'}</button><button class="danger" data-manage-action="end">영업 종료</button></div><div class="sheet-actions single"><button class="cancel" data-close>닫기</button></div>`);document.querySelector('[data-close]').onclick=closeSheet;document.querySelectorAll('[data-manage-action]').forEach(b=>b.onclick=()=>{const next=b.dataset.manageAction;closeSheet();stateAction(next)});return}if(action==='start'||action==='resume'){salesState='open';render();return}if(action==='break'){salesState='break';render();return}if(action==='end'){openSheet(`<h2>오늘 영업을 종료할까요?</h2><p>직접 종료해도 빠뜨린 판매는 지난달 1일부터 추가하거나 수정할 수 있어요.</p><div class="sheet-actions"><button class="cancel" data-close>취소</button><button class="apply" data-confirm-end>영업 종료</button></div>`);document.querySelector('[data-close]').onclick=closeSheet;document.querySelector('[data-confirm-end]').onclick=()=>{salesState='closedManual';closeSheet();render()}}}

    function hoursSheet(){openSheet(`<h2>영업시간</h2><div class="sheet-meta">15분 단위 또는 직접 입력</div><div class="sheet-section">시간</div><div class="time-fields"><label class="field">영업 시작<input type="time" step="900" value="${openTime}" data-hours-open></label><label class="field">영업 종료<input type="time" step="900" value="${closeTime}" data-hours-close></label></div><div class="sheet-section">종료하는 날</div><div class="day-choice"><button class="${!nextDay?'on':''}" data-day="same">오늘</button><button class="${nextDay?'on':''}" data-day="next">다음 날</button></div><div class="sheet-actions"><button class="cancel" data-close>취소</button><button class="apply" data-hours-apply>적용</button></div>`);let selectedNext=nextDay;document.querySelector('[data-close]').onclick=closeSheet;document.querySelectorAll('[data-day]').forEach(b=>b.onclick=()=>{selectedNext=b.dataset.day==='next';document.querySelectorAll('[data-day]').forEach(x=>x.classList.toggle('on',x===b))});document.querySelector('[data-hours-apply]').onclick=()=>{openTime=document.querySelector('[data-hours-open]').value||openTime;closeTime=document.querySelector('[data-hours-close]').value||closeTime;nextDay=selectedNext;closeSheet();render()}}

    function breakSheet(){openSheet(`<h2>브레이크 타임</h2><div class="sheet-section">사용 여부</div><div class="day-choice"><button class="${breakEnabled?'on':''}" data-break-use="on">사용</button><button class="${!breakEnabled?'on':''}" data-break-use="off">사용 안 함</button></div><div class="sheet-section">시간</div><div class="time-fields"><label class="field">시작<input type="time" step="900" value="${breakStartTime}" data-break-start></label><label class="field">종료<input type="time" step="900" value="${breakEndTime}" data-break-end></label></div><div class="sheet-actions"><button class="cancel" data-close>취소</button><button class="apply" data-break-apply>적용</button></div>`);let enabled=breakEnabled;document.querySelector('[data-close]').onclick=closeSheet;document.querySelectorAll('[data-break-use]').forEach(b=>b.onclick=()=>{enabled=b.dataset.breakUse==='on';document.querySelectorAll('[data-break-use]').forEach(x=>x.classList.toggle('on',x===b))});document.querySelector('[data-break-apply]').onclick=()=>{breakEnabled=enabled;breakStartTime=document.querySelector('[data-break-start]').value||breakStartTime;breakEndTime=document.querySelector('[data-break-end]').value||breakEndTime;closeSheet();render()}}

    function saveHours(){openSheet(`<h2>다음 영업일부터 적용돼요</h2><p>오늘 영업일은 기존 11:00–22:00으로 유지됩니다.</p><div class="warning-box"><strong>새 영업 일정</strong>${selectedDays.join(' · ')}<br>영업 ${openTime}–${nextDay?'다음 날 ':''}${closeTime}${breakEnabled?`<br>브레이크 ${breakStartTime}–${breakEndTime}`:'<br>브레이크 없음'}<br>8월 24일 영업일부터 적용</div><div class="sheet-actions"><button class="cancel" data-close>취소</button><button class="apply" data-save-confirm>저장</button></div>`);document.querySelector('[data-close]').onclick=closeSheet;document.querySelector('[data-save-confirm]').onclick=closeSheet}

    function editPast(){if(pastCase==='missing'){openSheet(`<h2>현재 기준으로 기록할까요?</h2><p>이 날짜의 당시 가격·원가가 없어 손익은 추정값으로 표시됩니다.</p><div class="warning-box"><strong>추정 기준</strong>현재 판매가 · 현재 재료 단가 · 현재 고정지출률</div><div class="sheet-actions"><button class="cancel" data-close>취소</button><button class="apply" data-estimate>계속</button></div>`);document.querySelector('[data-close]').onclick=closeSheet;document.querySelector('[data-estimate]').onclick=closeSheet;return}openSheet(`<h2>8월 22일 매출 수정</h2><p>그날 판매가·원가 기준은 그대로 유지하고 판매 수량만 수정해요.</p><div class="warning-box"><strong>현재 영업에는 영향 없음</strong>오늘 영업일을 닫거나 다시 열지 않습니다.</div><div class="sheet-actions"><button class="cancel" data-close>취소</button><button class="apply" data-edit>수정 시작</button></div>`);document.querySelector('[data-close]').onclick=closeSheet;document.querySelector('[data-edit]').onclick=closeSheet}

    function bind(){document.querySelectorAll('[data-screen]').forEach(b=>b.onclick=()=>{screen=b.dataset.screen;render()});document.querySelectorAll('[data-state]').forEach(b=>b.onclick=()=>{salesState=b.dataset.state;render()});document.querySelectorAll('[data-day-check]').forEach(b=>b.onclick=()=>{const day=b.dataset.dayCheck;selectedDays=selectedDays.includes(day)?selectedDays.filter(x=>x!==day):[...selectedDays,day];render()});const editHours=document.querySelector('[data-edit-hours]');if(editHours)editHours.onclick=hoursSheet;const breakButton=document.querySelector('[data-break]');if(breakButton)breakButton.onclick=breakSheet;document.querySelectorAll('[data-past-case]').forEach(b=>b.onclick=()=>{pastCase=b.dataset.pastCase;render()});document.querySelectorAll('[data-state-action]').forEach(b=>b.onclick=()=>stateAction(b.dataset.stateAction));const head=$('header-action');head.onclick=null;if(screen==='past')head.onclick=editPast;else if(screen==='hours')head.onclick=saveHours}

    function render(){document.querySelectorAll('[data-screen]').forEach(b=>b.classList.toggle('on',b.dataset.screen===screen));$('scenarios').innerHTML=scenarioButtons();$('title').textContent=screen==='sales'?'매출관리':screen==='hours'?'영업시간':'매출 상세';$('header-action').textContent=screen==='past'?'수정':'';$('content').className=`content ${screen==='hours'?'with-footer':''}`;$('content').innerHTML=screen==='sales'?salesScreen():screen==='hours'?hoursScreen():pastScreen();$('footer').innerHTML=screen==='hours'?'<footer class="footer"><button class="primary" data-save-hours>저장</button></footer>':'';const save=document.querySelector('[data-save-hours]');if(save)save.onclick=saveHours;bind()}

    $('overlay').onclick=e=>{if(e.target===$('overlay'))closeSheet()};
    render();
  </script>
</body>
</html>
