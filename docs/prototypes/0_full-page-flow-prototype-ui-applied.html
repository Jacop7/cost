    function openPopupTab(id){
      if(removedOrderOverviews.has(id)){setScreen('order_main');return;}
      activePopup=id;
      $('overlay').classList.remove('open');
      history.replaceState(null,'',`${location.pathname}?screen=${active}&popup=${id}`);
      renderNav();
      const renderOptionForm=index=>{optionEditIndex=index;optionVendor=null;optionUnit=index<0?'g':'';optionVendorAdding=false;optionVendorDraft='';optionUrl=index<0?'':screens.options.rows[index]?.[6]||'';render();$('content').scrollTop=0};
      if(id==='recipe_edit_menu'){
        $('sheet-body').innerHTML='<div class="prototype-sheet-group"><button class="prototype-sheet-row" type="button" data-menu-edit-action>수정</button></div><button class="edit-menu-close" type="button" data-menu-edit-close>닫기</button>';
        const close=()=>{activePopup=null;$('overlay').classList.remove('open');history.replaceState(null,'',location.pathname+'?screen=recipe_detail');renderNav()};
        document.querySelector('[data-menu-edit-close]').onclick=close;
        document.querySelector('[data-menu-edit-action]').onclick=()=>{close();setScreen('recipe_edit')};
        $('overlay').classList.add('open');return;
      }
      if(id==='recipe_sort')return openRecipeSortPicker();
      if(id==='sales_sort')return openSalesFeedSort();
      if(id==='recipe_status')return openRecipeStatusPicker();
      if(id==='recipe_target')return openRecipeTargetPicker();
      if(id==='recipe_ingredient_usage')return openRecipeIngredientUsage(recipePendingIngredient||undefined,active==='recipe_edit'?'edit':'add');
      if(id==='recipe_material_usage')return openRecipeMaterialUsage(recipePendingMaterial||undefined,active==='recipe_edit'?'edit':'add');
      if(openActualPopup(id))return;
      if(id==='ingredient_option_filled'||id==='ingredient_option_empty'){ingredientOptionState=id.endsWith('empty')?'empty':'filled';render();return}
      if(id==='sort')return openSortPicker();
      if(id==='add_category')return openCategoryPicker('add');
      if(id==='add_unit')return openUnitPicker('add');
      if(id==='edit_category')return openCategoryPicker('edit');
      if(id==='edit_unit')return openUnitPicker('edit');
      if(id==='stock_inbound'||id==='stock_deduct'||id==='stock_discard'){stockChangeMode=id.replace('stock_','');render();return}
      if(id==='stock_option'){stockChangeMode='inbound';render();return openStockOption()}
      if(id==='option_list'){optionEditIndex=null;render();return}
      if(id==='option_add'){renderOptionForm(-1);return}
      if(id==='option_edit'){renderOptionForm(0);return}
      if(id==='option_card_menu'){optionEditIndex=null;render();return openOptionCardMenu(0)}
      if(id==='option_vendor'||id==='option_vendor_new'||id==='option_unit'||id==='option_more'||id==='option_delete'){
        renderOptionForm(0);
        if(id==='option_vendor'){optionVendor=screens.options.rows[0]?.[0]||'';return openVendorPicker()}
        if(id==='option_vendor_new'){optionVendorAdding=true;render();return}
        if(id==='option_unit')return openUnitPicker('option');
        openOptionMore();
        if(id==='option_delete')document.querySelector('[data-option-delete]')?.click();
        return;
      }
      if(id==='stock_settings')return openHistoryFilter('stock','period');
      if(id==='stock_period'||id==='stock_type'||id==='stock_order')return openHistoryFilter('stock',{stock_period:'period',stock_type:'type',stock_order:'order'}[id]);

    renderActualHeaderExtras=()=>{searchSettingsHeaderBase();if(active==='sales_write'){$('header-actions').innerHTML='<button class="sales-write-header-reset" type="button" aria-label="초기화"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12a9 9 0 0 1-15.3 6.4L3 16"/><path d="M3 21v-5h5"/><path d="M3 12A9 9 0 0 1 18.3 5.6L21 8"/><path d="M21 3v5h-5"/></svg><span>초기화</span></button>';return}const target=active==='recipe_ingredient_search'?'ingredient_main':active==='recipe_material_search'?'recipe_materials':null;if(!target)return;const label=active==='recipe_ingredient_search'?'재료':'부자재';$('header-actions').innerHTML=`<button class="header-icon" type="button" aria-label="${label} 검색 메뉴 열기" style="min-width:44px;min-height:44px"><svg width="19" height="19" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="12" cy="5" r="1.7"/><circle cx="12" cy="12" r="1.7"/><circle cx="12" cy="19" r="1.7"/></svg></button>`;$('header-actions').querySelector('button').onclick=()=>{$('sheet-body').innerHTML=`<div class="prototype-sheet-group"><button class="prototype-sheet-row" type="button" data-search-manage>${label} 관리</button></div><button class="prototype-sheet-close" type="button" data-search-close>닫기</button>`;$('overlay').classList.add('open');document.querySelector('[data-search-manage]').onclick=()=>{$('overlay').classList.remove('open');setScreen(target)};document.querySelector('[data-search-close]').onclick=()=>$('overlay').classList.remove('open')}};
    const salesLifecycleHeaderBase=renderActualHeaderExtras;
    renderActualHeaderExtras=()=>{salesLifecycleHeaderBase();if(!['sales_write','day'].includes(active))return;const completed=active==='day';$('header-actions').innerHTML='<button class="header-icon" type="button" aria-label="'+(completed?'손익 계산':'매출 작성')+' 메뉴 열기" style="min-width:44px;min-height:44px"><svg width="19" height="19" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="12" cy="5" r="1.7"/><circle cx="12" cy="12" r="1.7"/><circle cx="12" cy="19" r="1.7"/></svg></button>';$('header-actions').querySelector('button').onclick=()=>{const edit=completed?'<button class="prototype-sheet-row" type="button" data-screen-link="sales_write">수정</button>':'';$('sheet-body').innerHTML=`<div class="prototype-sheet-group">${edit}<button class="prototype-sheet-row" type="button">초기화</button><button class="prototype-sheet-row" type="button">휴무 처리</button></div><button class="prototype-sheet-close" type="button" data-sales-menu-close>닫기</button>`;$('overlay').classList.add('open');document.querySelectorAll('#sheet-body [data-screen-link]').forEach(button=>button.onclick=()=>{$('overlay').classList.remove('open');setScreen(button.dataset.screenLink)});document.querySelector('[data-sales-menu-close]').onclick=()=>$('overlay').classList.remove('open')}};
    // Separate supplies screens are retired; identifiers remain bookmark aliases only.
    const retiredMaterialScreens=new Set(["recipe_material_search", "recipe_materials", "recipe_material_category", "my_materials", "my_material_categories"]);
    for(const domain of Object.values(domains))domain.screens=domain.screens.filter(id=>!retiredMaterialScreens.has(id));
    const retiredMaterialPopups=new Set(['recipe_material_usage','material_add','material_edit','material_category_pick','material_delete','sales_extra_detail']);
    for(const key of Object.keys(popupTabs))popupTabs[key]=popupTabs[key].filter(([id])=>!retiredMaterialPopups.has(id));
    const unifiedMyParityBase=renderMyParity;
    renderMyParity=v=>{const html=unifiedMyParityBase(v);if(html===null)return null;const template=document.createElement('template');template.innerHTML=html;template.content.querySelectorAll('[data-screen-link]').forEach(node=>{if(retiredMaterialScreens.has(node.dataset.screenLink))node.remove()});return template.innerHTML};
    const initialParams=new URLSearchParams(location.search);const initialPopup=initialParams.get('popup');setScreen(initialParams.get('screen')||'ingredient_main');if(initialParams.get('terms')==='1')showTerminology();else if(initialPopup&&(popupTabs[active]||[]).some(item=>item[0]===initialPopup))openPopupTab(initialPopup);
  </script>
