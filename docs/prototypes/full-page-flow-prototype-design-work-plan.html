<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>전체 페이지 프로토타입 · 디자인 작업 실행서</title>
  <style>
    :root{color-scheme:light;--bg:#f2f4f6;--surface:#fff;--ink:#191f28;--sub:#4e5968;--ter:#8b95a1;--line:#e5e8eb;--line2:#f2f4f6;--blue:#3182f6;--blue2:#eaf3ff}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Pretendard,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;line-height:1.65;-webkit-font-smoothing:antialiased}
    main{width:min(920px,100%);margin:auto;padding:32px 24px 80px}.toolbar{position:sticky;top:0;z-index:2;display:flex;gap:8px;margin:0 -8px 24px;padding:10px 8px;background:rgba(242,244,246,.94);backdrop-filter:blur(10px)}
    .toolbar a{flex:0 0 auto;padding:8px 12px;border:1px solid var(--line);border-radius:999px;background:#fff;color:var(--ink);font-size:13px;font-weight:700;text-decoration:none}.toolbar a.active{border-color:#9fc4ff;background:var(--blue2);color:var(--blue)}
    article{padding:32px;border:1px solid var(--line);border-radius:20px;background:var(--surface);box-shadow:0 8px 30px rgba(25,31,40,.06)}h1{margin:0 0 28px;font-size:28px;line-height:1.3}h2{margin:42px 0 14px;padding-top:8px;border-top:1px solid var(--line2);font-size:22px}h3{margin:28px 0 12px;font-size:18px}p{margin:10px 0;color:var(--sub)}ul,ol{margin:10px 0;padding-left:24px}li+li{margin-top:5px}blockquote{margin:0 0 24px;padding:14px 16px;border-left:3px solid var(--blue);border-radius:0 12px 12px 0;background:var(--blue2);color:var(--sub)}blockquote p{margin:0}blockquote p+p{margin-top:4px}code{overflow-wrap:anywhere;word-break:break-word;padding:2px 5px;border-radius:6px;background:var(--line2);color:#e64980;font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:.9em}pre{overflow:auto;padding:16px;border-radius:12px;background:#191f28;color:#fff}pre code{padding:0;background:none;color:inherit;overflow-wrap:normal;word-break:normal}table{display:block;width:100%;max-width:100%;margin:14px 0 22px;border-collapse:separate;border-spacing:0;border:1px solid var(--line);border-radius:12px;overflow-x:auto;font-size:14px}th,td{padding:11px 12px;border-right:1px solid var(--line2);border-bottom:1px solid var(--line2);text-align:left;vertical-align:top}th{background:#f9fafb;font-weight:800}tr:last-child td{border-bottom:0}th:last-child,td:last-child{border-right:0}strong{font-weight:800}hr{border:0;border-top:1px solid var(--line);margin:32px 0}.error{padding:16px;border-radius:12px;background:#fff0f1;color:#c92a2a}
    @media(max-width:640px){main{padding:12px 12px 56px}.toolbar{margin:0 -4px 12px;padding:8px 4px;overflow:auto}article{padding:20px 16px;border-radius:16px}h1{font-size:23px}h2{font-size:20px}table{display:block;overflow-x:auto;white-space:normal}}
  </style>
</head>
<body>
  <main>
    <nav class="toolbar" aria-label="관련 문서">
      <a data-doc="plan" href="?doc=plan">실행서</a>
      <a data-doc="context" href="?doc=context">디자인 맥락</a>
      <a data-doc="spec" href="?doc=spec">현재 확정안</a>
      <a data-doc="changelog" href="?doc=changelog">변경 기록</a>
      <a data-doc="guide" href="?doc=guide">상세 가이드</a>
      <a data-doc="review" href="?doc=review">검수 기록</a>
    </nav>
    <article id="document"><p>실행서를 불러오는 중입니다.</p></article>
  </main>
  <script>
    const escapeHtml=value=>value.replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
    const inline=value=>escapeHtml(value)
      .replace(/`([^`]+)`/g,'<code>$1</code>')
      .replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>');
    function renderMarkdown(source){
      const lines=source.replace(/^\uFEFF/,'').replace(/\r/g,'').split('\n');
      let html='',paragraph=[],list=null,code=false,codeLines=[];
      const flushParagraph=()=>{if(paragraph.length){html+=`<p>${inline(paragraph.join(' '))}</p>`;paragraph=[]}};
      const closeList=()=>{if(list){html+=`</${list}>`;list=null}};
      for(let i=0;i<lines.length;i+=1){const line=lines[i];
        if(line.startsWith('```')){flushParagraph();closeList();if(code){html+=`<pre><code>${escapeHtml(codeLines.join('\n'))}</code></pre>`;codeLines=[];code=false}else code=true;continue}
        if(code){codeLines.push(line);continue}
        const quote=line.match(/^>\s?(.*)$/);if(quote){flushParagraph();closeList();const parts=[];while(i<lines.length){const match=lines[i].match(/^>\s?(.*)$/);if(!match)break;parts.push(match[1]);i+=1}i-=1;html+='<blockquote>'+parts.map(part=>`<p>${inline(part)}</p>`).join('')+'</blockquote>';continue}
        if(/^\|.+\|$/.test(line.trim())&&i+1<lines.length&&/^\|?[\s:|-]+\|?$/.test(lines[i+1].trim())){flushParagraph();closeList();const headers=line.trim().slice(1,-1).split('|').map(x=>x.trim());i+=2;const rows=[];while(i<lines.length&&/^\|.+\|$/.test(lines[i].trim())){rows.push(lines[i].trim().slice(1,-1).split('|').map(x=>x.trim()));i+=1}i-=1;html+='<table><thead><tr>'+headers.map(x=>`<th>${inline(x)}</th>`).join('')+'</tr></thead><tbody>'+rows.map(row=>'<tr>'+row.map(x=>`<td>${inline(x)}</td>`).join('')+'</tr>').join('')+'</tbody></table>';continue}
        const heading=line.match(/^(#{1,3})\s+(.+)$/);if(heading){flushParagraph();closeList();const level=heading[1].length;html+=`<h${level}>${inline(heading[2])}</h${level}>`;continue}
        if(/^---+$/.test(line.trim())){flushParagraph();closeList();html+='<hr>';continue}
        const bullet=line.match(/^\s*-\s+(.+)$/);const ordered=line.match(/^\s*\d+\.\s+(.+)$/);if(bullet||ordered){flushParagraph();const type=bullet?'ul':'ol';if(list!==type){closeList();html+=`<${type}>`;list=type}html+=`<li>${inline((bullet||ordered)[1])}</li>`;continue}
        if(!line.trim()){flushParagraph();closeList();continue}paragraph.push(line.trim());
      }
      flushParagraph();closeList();if(codeLines.length)html+=`<pre><code>${escapeHtml(codeLines.join('\n'))}</code></pre>`;return html;
    }
    const documents={
      context:{file:'full-page-flow-prototype-design-context.md',title:'전체 페이지 프로토타입 · 디자인 맥락 장부'},
      plan:{file:'full-page-flow-prototype-design-work-plan.md',title:'전체 페이지 프로토타입 · 디자인 작업 실행서'},
      spec:{file:'full-page-flow-prototype-current-spec.md',title:'전체 페이지 흐름 프로토타입 · 현재 확정안'},
      changelog:{file:'full-page-flow-prototype-changelog.md',title:'전체 페이지 흐름 프로토타입 · 변경 기록'},
      guide:{file:'full-page-flow-prototype-ui-guide.md',title:'전체 페이지 흐름 프로토타입 · UI 상세 가이드'},
      review:{file:'full-page-flow-prototype-ui-applied-review.md',title:'전체 페이지 흐름 프로토타입 · 적용 검수 기록'}
    };
    const requestedKey=new URLSearchParams(location.search).get('doc')||'plan';
    const documentKey=documents[requestedKey]?requestedKey:'plan',selected=documents[documentKey];
    document.title=selected.title;
    document.querySelectorAll('[data-doc]').forEach(link=>{const active=link.dataset.doc===documentKey;link.classList.toggle('active',active);if(active)link.setAttribute('aria-current','page');else link.removeAttribute('aria-current')});
    fetch(selected.file,{cache:'no-store'})
      .then(response=>{if(!response.ok)throw new Error(`HTTP ${response.status}`);return response.arrayBuffer()})
      .then(buffer=>new TextDecoder('utf-8',{fatal:true}).decode(buffer))
      .then(markdown=>{document.getElementById('document').innerHTML=renderMarkdown(markdown)})
      .catch(error=>{document.getElementById('document').innerHTML=`<p class="error">문서를 불러오지 못했습니다. ${escapeHtml(String(error))}</p>`});
  </script>
</body>
</html>
