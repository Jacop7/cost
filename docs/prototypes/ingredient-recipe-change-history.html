<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>식재료·레시피 수정 내역 UI</title>
  <style>
    :root {
      --bg: #eef1f4;
      --app-bg: #f2f4f6;
      --surface: #ffffff;
      --surface-2: #f9fafb;
      --ink: #191f28;
      --ink-2: #333d4b;
      --sub: #4e5968;
      --sub-2: #6b7684;
      --ter: #8b95a1;
      --line: #e5e8eb;
      --line-2: #f2f4f6;
      --blue: #3182f6;
      --blue-tint: #ebf3fe;
      --green: #15b374;
      --green-tint: #e7f7f0;
      --amber: #e07a00;
      --amber-tint: #fff4e5;
      --scrim: rgba(0, 0, 0, .42);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 24px 12px 44px;
      color: var(--ink);
      background: radial-gradient(circle at 18% 8%, rgba(49, 130, 246, .12), transparent 26rem), var(--bg);
      font-family: Pretendard, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    button { font: inherit; }
    .workspace { width: min(840px, 100%); margin: 0 auto; }
    .prototype-title { margin: 0 0 13px; color: var(--sub); font-size: 13px; font-weight: 800; }
    .phones { display: grid; grid-template-columns: repeat(2, minmax(0, 390px)); justify-content: center; gap: 28px; }

    .phone {
      position: relative;
      height: min(820px, calc(100vh - 80px));
      min-height: 660px;
      overflow: hidden;
      border: 1px solid rgba(25, 31, 40, .1);
      border-radius: 30px;
      background: var(--surface);
      box-shadow: 0 24px 70px rgba(25, 31, 40, .15);
    }

    .status-bar { height: 28px; display: flex; align-items: center; justify-content: space-between; padding: 0 19px; font-size: 11px; font-weight: 800; background: var(--surface); }
    .app-header { height: 56px; display: flex; align-items: center; gap: 8px; padding: 0 15px; background: var(--surface); }

    .back { width: 25px; border: 0; padding: 0; color: var(--ink); background: transparent; font-size: 28px; line-height: 1; cursor: pointer; }
    .app-title { min-width: 0; flex: 1; overflow: hidden; font-size: 18px; font-weight: 800; text-overflow: ellipsis; white-space: nowrap; }

    .screen { height: calc(100% - 84px); overflow-y: auto; padding: 0 14px 30px; background: var(--app-bg); scrollbar-width: thin; }
    .query-row { display: flex; align-items: center; padding: 0 7px 11px; color: var(--sub); font-size: 12px; font-weight: 700; }
    .query-row span:first-child { flex: 1; }
    .query-row strong { color: var(--ter); font-weight: 800; }

    .summary {
      margin-bottom: 13px;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: var(--surface);
      box-shadow: 0 1px 3px rgba(0, 0, 0, .04);
    }

    .summary-main { display: flex; align-items: center; padding: 15px; border-bottom: 1px solid var(--line-2); }
    .summary-main span { flex: 1; color: var(--sub); font-size: 14px; font-weight: 800; }
    .summary-main strong { font-size: 15px; font-weight: 800; }
    .summary-split { display: grid; grid-template-columns: 1fr 1fr; }
    .summary-cell { padding: 13px 15px; }
    .summary-cell + .summary-cell { border-left: 1px solid var(--line-2); }
    .summary-cell span { display: block; color: var(--ter); font-size: 12px; font-weight: 700; }
    .summary-cell strong { display: block; margin-top: 4px; color: var(--blue); font-size: 16px; font-weight: 800; }
    .summary-cell.auto strong { color: var(--green); }

    .month { margin: 0 7px 8px; color: var(--sub); font-size: 13px; font-weight: 800; }
    .history-list { overflow: hidden; border: 1px solid var(--line); border-radius: 14px; background: var(--surface); box-shadow: 0 1px 3px rgba(0, 0, 0, .04); }

    .history-row {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 9px;
      padding: 14px 14px;
      border: 0;
      border-top: 1px solid var(--line-2);
      color: var(--ink);
      background: var(--surface);
      text-align: left;
      cursor: pointer;
    }

    .history-row:first-child { border-top: 0; }
    .history-copy { min-width: 0; flex: 1; }
    .history-date { display: block; color: var(--ter); font-size: 12px; font-weight: 700; }
    .history-name { display: block; margin-top: 4px; font-size: 15px; font-weight: 800; }
    .history-desc { display: block; overflow: hidden; margin-top: 4px; color: var(--sub-2); font-size: 12px; font-weight: 650; text-overflow: ellipsis; white-space: nowrap; }
    .history-result { flex: 0 0 auto; max-width: 116px; text-align: right; }
    .history-result strong { display: block; overflow: hidden; color: var(--blue); font-size: 14px; font-weight: 800; text-overflow: ellipsis; white-space: nowrap; }
    .history-result strong.neutral { color: var(--ink-2); }
    .history-result small { display: block; margin-top: 4px; color: var(--green); font-size: 11px; font-weight: 700; }
    .history-result small.pending { color: var(--amber); }
    .history-result small.irrelevant { color: var(--ter); }
    .chevron { flex: 0 0 auto; color: #d1d6db; font-size: 21px; }

    .overlay { position: absolute; z-index: 30; inset: 0; display: none; align-items: flex-end; background: var(--scrim); }
    .overlay.open { display: flex; }
    .sheet { width: 100%; max-height: 82%; overflow-y: auto; padding: 10px 14px 18px; border-radius: 22px 22px 0 0; background: var(--surface); }
    .handle { width: 40px; height: 5px; margin: 0 auto 13px; border-radius: 3px; background: var(--line); }
    .sheet-head { display: flex; align-items: flex-start; gap: 8px; padding: 4px 2px 14px; }
    .sheet-title { min-width: 0; flex: 1; }
    .sheet-title h2 { margin: 0; font-size: 19px; font-weight: 800; }
    .sheet-title p { margin: 5px 0 0; color: var(--ter); font-size: 12px; font-weight: 650; }
    .status { padding: 4px 7px; border-radius: 7px; color: var(--green); background: var(--green-tint); font-size: 11px; font-weight: 800; white-space: nowrap; }
    .status.pending { color: var(--amber); background: var(--amber-tint); }
    .status.irrelevant { color: var(--sub); background: var(--surface-2); }

    .detail-group { margin-top: 10px; overflow: hidden; border-radius: 12px; background: var(--surface-2); }
    .detail-heading { padding: 11px 12px; border-bottom: 1px solid var(--line); color: var(--sub); font-size: 13px; font-weight: 800; }
    .detail-rows { padding: 3px 12px; }
    .detail-row { display: flex; align-items: center; gap: 8px; padding: 9px 0; border-bottom: 1px solid var(--line-2); }
    .detail-row:last-child { border-bottom: 0; }
    .detail-row span { flex: 1; color: var(--sub); font-size: 13px; font-weight: 650; }
    .detail-row strong { max-width: 65%; color: var(--ink); font-size: 13px; font-weight: 800; text-align: right; }
    .arrow { margin: 0 4px; color: #b0b8c1; }
    .impact { margin: 10px 0 0; padding: 10px 11px; border-radius: 10px; color: #1f5fae; background: var(--blue-tint); font-size: 12px; font-weight: 700; line-height: 1.45; }
    .close { width: 100%; margin-top: 12px; padding: 15px; border: 0; border-radius: 12px; color: var(--ink); background: var(--surface-2); font-size: 15px; font-weight: 800; cursor: pointer; }

    @media (max-width: 820px) {
      .workspace { width: min(390px, 100%); }
      .phones { grid-template-columns: 1fr; }
      .phone { height: 780px; }
    }
  </style>
</head>
<body>
  <main class="workspace">
    <p class="prototype-title">재고 내역 UI를 적용한 최근 7일 수정 내역</p>
    <section class="phones">
      <article class="phone" data-kind="ingredient" aria-label="고추장 수정 내역">
        <div class="status-bar"><span>9:41</span><span>● ◔ ▰</span></div>
        <header class="app-header"><button class="back" type="button" aria-label="뒤로">‹</button><span class="app-title">수정 내역</span></header>
        <div class="screen">
          <div class="query-row"><span>최근 7일 기준</span><strong>3건</strong></div>
          <section class="summary">
            <div class="summary-main"><span>최근 수정</span><strong>오늘 03:56</strong></div>
            <div class="summary-split"><div class="summary-cell"><span>직접 수정</span><strong>2건</strong></div><div class="summary-cell auto"><span>자동 변경</span><strong>1건</strong></div></div>
          </section>
          <h2 class="month">2026년 8월</h2>
          <section class="history-list">
            <button class="history-row" type="button" data-index="0"><span class="history-copy"><span class="history-date">08/20 · 03:56</span><span class="history-name">기준 단가 변경</span><span class="history-desc">입고 확정 · 식자재쇼핑몰</span></span><span class="history-result"><strong>5.20원/g</strong><small class="pending">현재 매출 미반영</small></span><span class="chevron">›</span></button>
            <button class="history-row" type="button" data-index="1"><span class="history-copy"><span class="history-date">08/18 · 09:10</span><span class="history-name">안전재고 수정</span><span class="history-desc">1개에서 2개로 변경</span></span><span class="history-result"><strong class="neutral">2개</strong><small class="irrelevant">매출 계산과 무관</small></span><span class="chevron">›</span></button>
            <button class="history-row" type="button" data-index="2"><span class="history-copy"><span class="history-date">08/15 · 16:42</span><span class="history-name">기본 거래처 수정</span><span class="history-desc">시장마트 → 식자재쇼핑몰</span></span><span class="history-result"><strong class="neutral">변경</strong><small class="irrelevant">매출 계산과 무관</small></span><span class="chevron">›</span></button>
          </section>
        </div>
        <div class="overlay" role="dialog" aria-modal="true"><section class="sheet"><div class="handle"></div><div class="sheet-head"><div class="sheet-title"><h2></h2><p></p></div><span class="status"></span></div><div class="detail-group"><div class="detail-heading">변경 내용</div><div class="detail-rows"></div></div><p class="impact"></p><button class="close" type="button">닫기</button></section></div>
      </article>

      <article class="phone" data-kind="recipe" aria-label="제육볶음 수정 내역">
        <div class="status-bar"><span>9:41</span><span>● ◔ ▰</span></div>
        <header class="app-header"><button class="back" type="button" aria-label="뒤로">‹</button><span class="app-title">수정 내역</span></header>
        <div class="screen">
          <div class="query-row"><span>최근 7일 기준</span><strong>3건</strong></div>
          <section class="summary">
            <div class="summary-main"><span>최근 수정</span><strong>오늘 03:56</strong></div>
            <div class="summary-split"><div class="summary-cell"><span>직접 수정</span><strong>1건</strong></div><div class="summary-cell auto"><span>자동 반영</span><strong>2건</strong></div></div>
          </section>
          <h2 class="month">2026년 8월</h2>
          <section class="history-list">
            <button class="history-row" type="button" data-index="0"><span class="history-copy"><span class="history-date">08/20 · 03:56</span><span class="history-name">고추장 단가 자동 반영</span><span class="history-desc">식재료 변경에서 자동 전파</span></span><span class="history-result"><strong>2,838원</strong><small class="pending">현재 매출 미반영</small></span><span class="chevron">›</span></button>
            <button class="history-row" type="button" data-index="1"><span class="history-copy"><span class="history-date">08/20 · 02:30</span><span class="history-name">판매가 수정</span><span class="history-desc">12,000원에서 13,000원으로 변경</span></span><span class="history-result"><strong>13,000원</strong><small class="pending">현재 매출 미반영</small></span><span class="chevron">›</span></button>
            <button class="history-row" type="button" data-index="2"><span class="history-copy"><span class="history-date">08/15 · 10:12</span><span class="history-name">고정지출 자동 반영</span><span class="history-desc">이번 달 고정지출률 갱신</span></span><span class="history-result"><strong>31.3%</strong><small>현재 매출 반영</small></span><span class="chevron">›</span></button>
          </section>
        </div>
        <div class="overlay" role="dialog" aria-modal="true"><section class="sheet"><div class="handle"></div><div class="sheet-head"><div class="sheet-title"><h2></h2><p></p></div><span class="status"></span></div><div class="detail-group"><div class="detail-heading">변경 내용</div><div class="detail-rows"></div></div><p class="impact"></p><button class="close" type="button">닫기</button></section></div>
      </article>
    </section>
  </main>

  <script>
    const histories = {
      ingredient: [
        { title: '기준 단가 변경', date: '2026.08.20 03:56 · 입고 확정', status: '현재 매출 미반영', tone: 'pending', rows: [['기준 단가', '5.00원/g', '5.20원/g'], ['입고처', '—', '식자재쇼핑몰']], impact: '연결된 레시피 3개의 현재 원가는 다시 계산됐어요. 오늘 매출 장부에는 다음 영업일부터 적용돼요.' },
        { title: '안전재고 수정', date: '2026.08.18 09:10 · 사용자 직접 수정', status: '매출 계산과 무관', tone: 'irrelevant', rows: [['안전재고', '1개', '2개']], impact: '발주 후보 판정 기준만 변경됐어요.' },
        { title: '기본 거래처 수정', date: '2026.08.15 16:42 · 사용자 직접 수정', status: '매출 계산과 무관', tone: 'irrelevant', rows: [['기본 거래처', '시장마트', '식자재쇼핑몰']], impact: '다음 구매 옵션 선택의 기본값만 변경됐어요.' },
      ],
      recipe: [
        { title: '고추장 단가 자동 반영', date: '2026.08.20 03:56 · 식재료 자동 전파', status: '현재 매출 미반영', tone: 'pending', rows: [['재료비', '2,806.40원', '2,838.40원'], ['순이익', '4,046.69원', '4,014.69원']], impact: '레시피의 현재 원가는 갱신됐고 오늘 매출 장부는 영업 시작 시점 값을 유지해요.' },
        { title: '판매가 수정', date: '2026.08.20 02:30 · 사용자 직접 수정', status: '현재 매출 미반영', tone: 'pending', rows: [['판매가', '12,000원', '13,000원']], impact: '새 판매가는 다음 영업일부터 매출에 적용돼요.' },
        { title: '고정지출 자동 반영', date: '2026.08.15 10:12 · 고정지출 자동 전파', status: '현재 매출 반영', tone: '', rows: [['고정지출률', '31.0%', '31.3%'], ['개당 고정비', '3,720원', '3,760원']], impact: '영업 시작 전에 변경되어 현재 매출 기준에 포함됐어요.' },
      ],
    };

    document.querySelectorAll('.phone').forEach((phone) => {
      const kind = phone.dataset.kind;
      const overlay = phone.querySelector('.overlay');
      const title = overlay.querySelector('.sheet-title h2');
      const date = overlay.querySelector('.sheet-title p');
      const status = overlay.querySelector('.status');
      const detailRows = overlay.querySelector('.detail-rows');
      const impact = overlay.querySelector('.impact');

      phone.querySelectorAll('.history-row').forEach((button) => {
        button.addEventListener('click', () => {
          const entry = histories[kind][Number(button.dataset.index)];
          title.textContent = entry.title;
          date.textContent = entry.date;
          status.textContent = entry.status;
          status.className = `status ${entry.tone}`.trim();
          detailRows.innerHTML = entry.rows.map(([label, before, after]) => `<div class="detail-row"><span>${label}</span><strong>${before}<span class="arrow">→</span>${after}</strong></div>`).join('');
          impact.textContent = entry.impact;
          overlay.classList.add('open');
        });
      });

      overlay.querySelector('.close').addEventListener('click', () => overlay.classList.remove('open'));
      overlay.addEventListener('click', (event) => { if (event.target === overlay) overlay.classList.remove('open'); });
    });
  </script>
</body>
</html>
