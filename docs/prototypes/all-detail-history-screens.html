      sales_fixed:{domain:'sales',label:'고정 지출',title:'고정 지출',route:'SALES-13',kind:'ledger',summary:['기간 귀속 합계','627,252원',[['매출 대비','31.3%',''],['기간','7일','']]],rows:[['인건비','월 입력값에서 기간 귀속','280,000원'],['임대료','월 입력값에서 기간 귀속','182,000원'],['플랫폼 수수료','채널 비중 적용','96,252원'],['공과금','월 입력값에서 기간 귀속','69,000원']]},

    };
    const statementRows=[['판매 수량','167개',''],['매출','2,004,000원','100%'],['(−) 재료 원가','468,920원','23.4%'],['(−) 부자재','43,280원','2.2%'],['(−) 폐기 손실','28,000원','1.4%'],['(−) 고정 지출','627,252원','31.3%'],['(−) 추가 지출','38,000원','1.9%'],['(−) 세금','182,182원','9.1%'],['순이익','616,366원','30.8%']];
    let active='stock'; const historyFilters={stock:{period:'최근 3개월',type:'전체'},purchase:{period:'최근 3개월'},discard:{period:'최근 3개월',type:'전체'}}; const $=id=>document.getElementById(id);
    const badge=t=>t?`<span class="badge ${t==='최저'?'blue':t==='최고'?'red':''}">${t}</span>`:'';
    function summary(s){if(!s)return'';return `<section class="card"><div class="summary-head"><span>${s[0]}</span><strong>${s[1]}</strong></div><div class="summary-grid">${s[2].map(m=>`<div class="metric"><small>${m[0]}</small><b class="${m[2]}">${m[1]}</b></div>`).join('')}</div></section>`}
    function tabs(items){return items?.length?`<nav class="tabs">${items.map((x,i)=>`<button class="tab ${i===0?'active':''}">${x}</button>`).join('')}</nav>`:''}
    function rowsCard(rows,click=false){return `<section class="card">${rows.map((r,i)=>`<button class="row ${click?'click':''}" ${click?`data-detail="${i}"`:''}><span class="row-main"><span class="row-top">${r[0]} ${['최저','최고'].includes(r[4])?badge(r[4]):''}</span><span class="row-title">${r[1]}</span>${r[2]?`<span class="row-sub">${r[2]}</span>`:''}</span><span class="values"><b class="${r[5]||''}">${r[3]}</b>${r[4]&&!['최저','최고'].includes(r[4])?`<small>${r[4]}</small>`:''}</span>${click?'<span class="chev">›</span>':''}</button>`).join('')}</section>`}
    function historyRows(key,s){const filter=historyFilters[key];let rows=[...s.rows];if(filter?.type&&filter.type!=='전체')rows=rows.filter(r=>key==='stock'?(filter.type==='폐기'?r[1].includes('폐기'):filter.type==='조정'?r[1].includes('조정'):r[1]===filter.type):r[1]===filter.type);return rows}
    function historyControls(key){const filter=historyFilters[key];if(!filter)return'<span>▣ 최근 3개월</span>';const type=filter.type?`<button class="condition-filter type" type="button" data-history-screen="${key}" data-history-filter="type" aria-label="${screens[key].label} 유형"><span class="filter-text">${filter.type}</span><span class="filter-arrow" aria-hidden="true">⌄</span></button>`:'';return `<div class="condition-actions">${type}<button class="condition-filter period" type="button" data-history-screen="${key}" data-history-filter="period" aria-label="${screens[key].label} 기간"><span class="filter-text">${filter.period}</span><span class="filter-arrow" aria-hidden="true">⌄</span></button></div>`}
    function renderHistory(s){const key=Object.keys(screens).find(name=>screens[name]===s);const rows=historyRows(key,s);const filter=historyFilters[key];const summaryHtml=!filter?.type||filter.type==='전체'?summary(s.summary):'';return `<div class="condition">${historyControls(key)}<span>${rows.length}건</span></div>${summaryHtml}<h2 class="month">2026년 8월</h2>${rowsCard(rows)}`}
    function renderChange(s){return `<section class="card"><div class="entity"><span class="entity-icon">${s.entity[0]==='식재료'?'食':'R'}</span><span><b>${s.entity[1]}</b><span>${s.entity[0]} · ${s.entity[2]}</span></span></div><div class="change-stats"><span>최근 7일 기준 <b>${s.rows.length}건</b></span><span>최근 수정 <b>14:41</b></span></div></section><h2 class="month">2026년 8월</h2>${rowsCard(s.rows,true)}`}
    function renderOptions(s){return `<section class="card">${s.rows.map((r,i)=>`<button class="row option-row"><span class="row-main"><span class="row-top">${r[0]} ${badge(r[5])}</span><span class="row-title">${r[1]}</span><span class="row-sub">${r[2]}</span></span><span class="values"><b>${r[3]}</b><small class="option-price">${r[4]}</small></span><span class="chev">›</span></button>`).join('')}</section><div class="bottom-space"></div>`}
    function renderProfit(s){return `<div class="condition"><span>최근 30일 기준</span><span>${s.rows.length}건</span></div><h2 class="month">2026년 8월</h2>${rowsCard(s.rows,true)}`}
    function renderTrend(){return `<div class="chips"><button class="chip">최근 1개월</button><button class="chip active">최근 3개월</button><button class="chip">최근 6개월</button><button class="chip">최근 12개월</button></div><section class="card chart-card"><div class="chart-legend"><span class="blue">● 순이익률</span><span style="color:#97a0ab">● 재료 원가율</span></div><div class="chart"><svg viewBox="0 0 330 126" preserveAspectRatio="none"><polyline points="0,73 58,60 126,70 198,42 262,52 330,27" fill="none" stroke="#97a0ab" stroke-width="3"/><polyline points="0,53 58,66 126,56 198,80 262,65 330,91" fill="none" stroke="#3182f6" stroke-width="3"/><g fill="#3182f6">${[[0,53],[58,66],[126,56],[198,80],[262,65],[330,91]].map(p=>`<circle cx="${p[0]}" cy="${p[1]}" r="4"/>`).join('')}</g></svg></div><div class="chart-labels"><span>5/22</span><span>6/18</span><span>7/14</span><span>8/20</span></div><div class="range-row"><span class="blue">순이익률</span><span>최저 31.8% · 최고 34.5%</span></div><div class="range-row"><span style="color:#7f8994">재료 원가율</span><span>최저 22.9% · 최고 25.4%</span></div></section>`}
    function lineCard(rows){return `<section class="card">${rows.map((r,i)=>`<div class="line-row ${i===rows.length-1?'total':''}"><span class="label">${r[0]}</span><strong class="amount ${r[0]==='순이익'?'green':''}">${r[1]}</strong><span class="percent">${r[2]||''}</span></div>`).join('')}</section>`}
    function renderFixed(){return `<div class="chips"><button class="chip active">8월</button><button class="chip">7월</button><button class="chip">6월</button><button class="chip">5월</button></div><section class="card"><div class="hero"><span class="hero-label">총 월매출</span><strong class="hero-value">20,000,000원</strong><div class="hero-meta">고정 지출률 31.3%</div></div></section><div class="section-label">항목별 고정 지출</div>${lineCard([['인건비','3,200,000원','16.0%'],['임대료','1,500,000원','7.5%'],['공과금','560,000원','2.8%'],['플랫폼 수수료','700,000원','3.5%'],['기타','300,000원','1.5%'],['고정 지출 합계','6,260,000원','31.3%']])}`}
    function channelMix(){return `<section class="card"><div class="donut-wrap"><div class="donut"><div class="donut-center"><small>순이익률</small><b class="green">30.8%</b></div></div><div class="legend"><div class="legend-row"><i class="dot" style="background:#3182f6"></i><span>매장</span><b>1,122,000원</b></div><div class="legend-row"><i class="dot" style="background:#7a8694"></i><span>배달</span><b>582,000원</b></div><div class="legend-row"><i class="dot" style="background:#c5ccd3"></i><span>포장</span><b>276,000원</b></div><div class="legend-row"><i class="dot" style="background:#e5e8eb"></i><span>기타</span><b>24,000원</b></div></div></div></section>`}
    function renderOverview(s){return `<div class="condition"><span>▣ ${s.period}</span><span>167개</span></div><section class="card"><div class="hero"><span class="hero-label">매출</span><strong class="hero-value">2,004,000원</strong><div class="hero-meta">순이익 616,366원 · 30.8%</div></div><div class="kpis"><div class="kpi"><small>재료 원가</small><b>468,920원</b></div><div class="kpi"><small>고정 지출</small><b>627,252원</b></div><div class="kpi"><small>세금</small><b>182,182원</b></div></div></section><div class="section-label">채널 구성 <span>자세히 보기</span></div>${channelMix()}<div class="section-label">손익 계산 <span>자세히 보기</span></div>${lineCard(statementRows)}`}
    function renderStatement(s){const menu=s.menu?`<section class="card"><div class="hero"><span class="hero-label">제육볶음 · 82개 판매</span><strong class="hero-value">984,000원</strong><div class="hero-meta">개당 순이익 4,046.69원 · 33.72%</div></div></section><div class="section-label">1인분 손익</div>`:`<div class="condition"><span>2026년 8월 20일</span><span>167개</span></div>`;const rows=s.menu?[['판매가','12,000원','100%'],['(−) 재료비','2,806.40원','23.4%'],['(−) 부자재','300원','2.5%'],['(−) 고정 지출','3,756원','31.3%'],['(−) 세금','1,090.91원','9.1%'],['순이익','4,046.69원','33.72%']]:statementRows;return menu+lineCard(rows)}
    function renderLedger(s){return `<div class="condition"><span>▣ 08/14–08/20</span><span>${s.rows.length}항목</span></div>${summary(s.summary)}<div class="section-label">세부 내역</div><section class="card">${s.rows.map(r=>`<div class="row"><span class="row-main"><span class="row-title">${r[0]}</span><span class="row-sub">${r[1]}</span></span><span class="values"><b>${r[2]}</b></span><span class="chev">›</span></div>`).join('')}</section>`}
    function renderChannels(){const c=[['매장','1,122,000원','56%','328,400원 · 29.3%'],['배달','582,000원','29%','167,260원 · 28.7%'],['포장','276,000원','14%','103,706원 · 37.6%'],['기타','24,000원','1%','17,000원 · 70.8%']];return `<div class="condition"><span>▣ 08/14–08/20</span><span>매출 2,004,000원</span></div>${c.map((r,i)=>`<section class="card channel-card"><div class="channel-name"><span>${r[0]}</span><b>${r[1]}</b></div><div class="bar"><i style="width:${r[2]};background:${['#3182f6','#7a8694','#c5ccd3','#e5e8eb'][i]}"></i></div><div class="channel-meta"><span>매출 비중 ${r[2]}</span><span>순이익 ${r[3]}</span></div></section>`).join('')}`}
    function render(){const s=screens[active];$('title').textContent=s.title;$('route').textContent=s.route;$('bottom-action').innerHTML=s.kind==='options'?'<footer class="bottom-action"><button class="primary">구매 옵션 추가</button></footer>':'';const fn={history:renderHistory,change:renderChange,options:renderOptions,profit:renderProfit,trend:renderTrend,fixed:renderFixed,overview:renderOverview,statement:renderStatement,ledger:renderLedger,channels:renderChannels}[s.kind];$('content').innerHTML=fn(s);renderNav();bindDetails();}
    function renderNav(){const d=screens[active].domain;$('catalog-meta').textContent=`총 ${Object.keys(screens).length}개 화면 · ${screens[active].route}`;$('domain-nav').innerHTML=Object.entries(domains).map(([k,v])=>`<button class="nav-button domain-button ${k===d?'active':''}" data-domain="${k}">${v.label} ${v.screens.length}</button>`).join('');$('screen-nav').innerHTML=domains[d].screens.map(k=>`<button class="nav-button ${k===active?'active':''}" data-screen="${k}">${screens[k].label}</button>`).join('');document.querySelectorAll('[data-domain]').forEach(b=>b.onclick=()=>setScreen(domains[b.dataset.domain].screens[0]));document.querySelectorAll('[data-screen]').forEach(b=>b.onclick=()=>setScreen(b.dataset.screen));}
    function bindDetails(){document.querySelectorAll('[data-detail]').forEach(b=>b.onclick=()=>openDetail(Number(b.dataset.detail)));document.querySelectorAll('.tab,.chip').forEach(b=>b.onclick=()=>{b.parentElement.querySelectorAll('button').forEach(x=>x.classList.remove('active'));b.classList.add('active')});document.querySelectorAll('[data-history-filter]').forEach(button=>button.onclick=()=>openHistoryFilter(button.dataset.historyScreen,button.dataset.historyFilter))}
    function compare(rows){return `<section class="card">${rows.map(r=>`<div class="compare"><span>${r[0]}</span><span class="before">${r[1]}</span><span class="arrow">→</span><strong class="after">${r[2]}</strong></div>`).join('')}</section>`}
    function openDetail(i){const s=screens[active],r=s.rows[i];let html='';if(s.kind==='change'){html=`<h2>${r[1]}</h2><div class="sheet-meta">${r[0]} · ${s.entity[0]}</div><div class="sheet-section">직접 수정</div>${compare(active==='recipe_changes'?[['판매가','9,500원','9,000원'],['부자재','120원','320원']]:[['안전재고','1kg','1.5kg']])}<div class="sheet-section">자동 갱신</div>${compare(active==='recipe_changes'?[['세금','863.64원','818.18원'],['순이익','2,278.92원','1,780.88원']]:[['기준 단가','5.20원/g','4.95원/g']])}`}else{html=`<h2>${r[1]}</h2><div class="sheet-meta">${r[0]} · 손익 변동</div><div class="sheet-section">변동 원인</div>${compare([[r[1].includes('고춧가루')?'고춧가루 기준단가':r[1].includes('고정')?'고정 지출':'판매가',r[1].includes('고춧가루')?'160원':r[1].includes('고정')?'3,720원':'11,500원',r[1].includes('고춧가루')?'128원':r[1].includes('고정')?'3,756원':'12,000원']])}<div class="sheet-section">손익 결과</div>${compare([['순이익',i===0?'4,014.69원':'4,050.69원',r[3]],['순이익률',i===0?'33.46%':'33.76%',i===0?'33.72%':'33.46%']])}`}$('sheet-body').innerHTML=html;$('overlay').classList.add('open')}
    function filterChoices(group,items,current){return `<div class="filter-options">${items.map(item=>`<button class="filter-option ${item===current?'selected':''}" type="button" data-filter-group="${group}" data-filter-value="${item}">${item}</button>`).join('')}</div>`}
    function openHistoryFilter(key,group){const isType=group==='type';const typeItems=key==='discard'?['전체','조리 전 폐기','조리 후 폐기']:['전체','입고','판매 소진','폐기','조정'];const items=isType?typeItems:['최근 1개월','최근 3개월','최근 6개월','전체'];const filter=historyFilters[key];$('sheet-body').innerHTML=`<h2>${isType?'유형':'기간'}</h2><div class="sheet-section">${isType?'기록 유형':'조회 기간'}</div>${filterChoices(group,items,filter[group])}<button class="primary filter-apply" type="button" data-filter-apply>적용</button>`;$('overlay').classList.add('open');document.querySelectorAll('[data-filter-group]').forEach(button=>button.onclick=()=>{document.querySelectorAll(`[data-filter-group="${group}"]`).forEach(item=>item.classList.remove('selected'));button.classList.add('selected')});document.querySelector('[data-filter-apply]').onclick=()=>{const selected=document.querySelector(`[data-filter-group="${group}"].selected`);if(selected)filter[group]=selected.dataset.filterValue;$('overlay').classList.remove('open');render()}}
    function setScreen(k){if(!screens[k])k='stock';active=k;$('overlay').classList.remove('open');history.replaceState(null,'',`${location.pathname}?screen=${k}`);render();$('content').scrollTop=0}
    $('overlay').onclick=e=>{if(e.target===$('overlay'))$('overlay').classList.remove('open')};
    setScreen(new URLSearchParams(location.search).get('screen')||'stock');
  </script>
