    function renderSalesExtra(){const rows=[['특수 포장용기 <span style="color:var(--ter)">12개</span>','제육볶음','3,600원',true],['불판 가스비 <span style="color:var(--ter)">16개</span>','김치찌개 · 소불고기','3,200원',true],['뚝배기 가스비 <span style="color:var(--ter)">16개</span>','김치찌개 · 된장찌개','1,920원',true]];return `<section class="card"><div class="revenue-summary"><div class="revenue-summary-row"><span>영업일</span><b>8월 22일 (토)</b></div><div class="revenue-summary-row"><span>부자재 합계</span><b>8,720원</b></div><div class="revenue-summary-row"><span>매출 대비</span><b>1.6%</b></div></div><div class="detail-section-title">사용 부자재</div><div class="detail-list">${rows.map(r=>`<div class="detail-list-row"><span class="detail-list-copy"><strong>${r[0]}</strong><small>${r[1]}</small></span><b>${r[2]}</b><span class="chev">›</span></div>`).join('')}</div></section>`}
    function renderSalesWaste(){return `<section class="card"><div class="revenue-summary"><div class="revenue-summary-row"><span>영업일</span><b>8월 22일 (토)</b></div><div class="revenue-summary-row"><span>폐기 손실 합계</span><b class="red">−4,789원</b></div><div class="revenue-summary-row"><span>매출 대비</span><b class="red">−0.9%</b></div></div><div class="detail-section-title">조리 폐기</div><div class="detail-list"><div class="detail-list-row"><span class="detail-list-copy"><strong>소불고기</strong><small>1인분</small></span><span class="sales-menu-values"><b>4,789원</b></span></div></div><div class="detail-section-title" style="border-top:1px solid var(--line2)">식재료 폐기</div><div class="detail-list"><div class="detail-list-row"><span class="detail-list-copy"><strong style="color:var(--ter)">기록 없음</strong></span><b style="color:var(--ter)">0원</b></div></div></section>`}
    function renderSalesTax(){return `<section class="card"><div class="revenue-summary"><div class="revenue-summary-row"><span>영업일</span><b>8월 22일 (토)</b></div><div class="revenue-summary-row"><span>세금 합계</span><b>48,136원</b></div><div class="revenue-summary-row"><span>매출 대비</span><b>9.1%</b></div></div><div class="detail-section-title">항목별</div><div class="detail-list"><div class="detail-list-row"><span class="detail-list-copy"><strong>부가세</strong><small>매출 529,500원</small></span><span class="sales-menu-values"><b>48,136원</b><small>9.09%</small></span></div></div></section>`}
    function renderSalesFixed(){const rows=[['인건비','월 2,400,000원 · 이 기간 몫 63.9%','105,900원'],['플랫폼 수수료','월 603,000원 · 이 기간 몫 16.1%','26,607원'],['포장비','월 380,000원 · 이 기간 몫 10.1%','16,768원'],['광고/홍보','월 253,000원 · 이 기간 몫 6.7%','11,164원'],['배달/배송','월 120,000원 · 이 기간 몫 3.2%','5,295원']];return `<section class="card"><div class="revenue-summary"><div class="revenue-summary-row"><span>영업일</span><b>8월 22일 (토)</b></div><div class="revenue-summary-row"><span>고정 지출 합계</span><div class="fixed-ledger-total-value"><b>165,734원</b><span>31.3%</span></div></div></div></section>${rows.map(r=>`<section class="card fixed-ledger-card"><div class="fixed-ledger-top"><strong>${r[0]}</strong><b>${r[2]}</b><span class="chev">⌄</span></div><div class="fixed-ledger-sub">${r[1]}</div></section>`).join('')}`}
    function renderSalesExpense(){const total=salesExpenseRows.reduce((sum,row)=>sum+row[2],0);return `<section class="card"><div class="revenue-summary"><div class="revenue-summary-row"><span>영업일</span><b>8월 22일 (토)</b></div></div></section><section class="card"><div class="detail-list">${salesExpenseRows.map((r,i)=>`<div class="detail-list-row"><span class="detail-list-copy"><strong style="color:var(--ink)">${r[0]}</strong>${r[1]?`<small>${r[1]}</small>`:''}</span><b>${r[2].toLocaleString('ko-KR')}원</b><button class="expense-delete" type="button" data-expense-delete="${i}" aria-label="${r[0]} 삭제">×</button></div>`).join('')}<div class="revenue-subtotal last"><span>합계</span><b>${total.toLocaleString('ko-KR')}원</b></div></div></section><div class="bottom-space"></div>`}
    function menuProfitCard(){const rows=[['재료','33,677원','23.4%'],['부자재','3,600원','2.5%'],['고정 지출','45,072원','31.3%'],['세금','13,091원','9.1%'],['순이익','48,560원','33.7%','profit']];return `${salesSection('8월 22일 판매량 기준')}${salesBreakdown(rows,true)}`}
    function menuChannelCard(){const rows=[['매장','120,000원','10개 / 83.3%'],['배달','12,000원','1개 / 8.3%'],['포장','12,000원','1개 / 8.3%']];return `${salesSection('채널 구성')}<section class="card"><div class="detail-list">${rows.map(r=>`<div class="detail-list-row"><span class="detail-list-copy"><strong style="color:var(--ink)">${r[0]}</strong></span><span class="sales-menu-values"><b>${r[1]}</b><small>${r[2]}</small></span></div>`).join('')}</div></section>`}
    function menuDetailCard(title,sub,rows,total){return `<section class="card"><div class="detail-head"><span style="font-weight:850">${title} <small style="color:var(--ter)">${sub||''}</small></span></div><div class="detail-list">${rows.map(r=>`<div class="detail-list-row"><span class="detail-list-copy"><strong style="color:var(--ink)">${r[0]}</strong>${r[1]?`<small>${r[1]}</small>`:''}</span><span class="sales-menu-values"><b>${r[2]}</b>${r[3]?`<small>${r[3]}</small>`:''}</span></div>`).join('')}${total?`<div class="revenue-subtotal last"><span>소계</span><span class="sales-menu-values"><b>${total[0]}</b>${total[1]?`<small>${total[1]}</small>`:''}</span></div>`:''}</div></section>`}
    function renderSalesMenu(){const materials=[['돼지고기 앞다리','13.00원/g','31,200원','2.4kg / 21.7%'],['양파','1.89원/g','1,140원','600g / 0.8%'],['대파','4.00원/g','1,200원','300g / 0.8%'],['다진마늘','8.50원/g','144원','12g / 0.1%']];const fixed=[['고정 지출','','45,072원','31.3%'],['부가세','','13,091원','9.1%']];return `<section class="card"><div class="menu-summary-title">제육볶음</div>${[['영업일','8월 22일 (토)'],['판매 수량','12개'],['매출','144,000원']].map(r=>`<div class="menu-summary-row"><span>${r[0]}</span><b>${r[1]}</b></div>`).join('')}<div class="menu-summary-row"><span class="menu-summary-copy"><strong>순이익률</strong><small>목표 40%</small></span><b class="red">33.7%</b></div></section>${menuProfitCard()}${menuChannelCard()}${menuDetailCard('재료','',materials,['33,677원','23.4%'])}${menuDetailCard('부자재','',[['특수 포장용기','','3,600원','12개 / 2.5%']])}${menuDetailCard('고정 지출 · 세금','',fixed)}`}
    function renderLedger(s){return `<div class="condition"><span>▣ 08/14–08/20</span><span>${s.rows.length}항목</span></div>${summary(s.summary)}<div class="section-label">세부 내역</div><section class="card">${s.rows.map(r=>`<div class="row"><span class="row-main"><span class="row-title">${r[0]}</span><span class="row-sub">${r[1]}</span></span><span class="values"><b>${r[2]}</b></span><span class="chev">›</span></div>`).join('')}</section>`}
    function renderChannels(){const c=[['매장','1,122,000원','56%','328,400원 · 29.3%'],['배달','582,000원','29%','167,260원 · 28.7%'],['포장','276,000원','14%','103,706원 · 37.6%'],['기타','24,000원','1%','17,000원 · 70.8%']];return `<div class="condition"><span>▣ 08/14–08/20</span><span>매출 2,004,000원</span></div>${c.map((r,i)=>`<section class="card channel-card"><div class="channel-name"><span>${r[0]}</span><b>${r[1]}</b></div><div class="bar"><i style="width:${r[2]};background:${['#3182f6','#7a8694','#c5ccd3','#e5e8eb'][i]}"></i></div><div class="channel-meta"><span>매출 비중 ${r[2]}</span><span>순이익 ${r[3]}</span></div></section>`).join('')}`}
    function render(){const s=screens[active];$('title').textContent=s.title;$('route').textContent=s.route;$('bottom-action').innerHTML=s.kind==='options'?'<footer class="bottom-action"><button class="primary">구매 옵션 추가</button></footer>':s.kind==='fixed'?'<footer class="bottom-action"><button class="primary">고정지출 입력</button></footer>':s.kind==='sales_expense'?'<footer class="bottom-action"><button class="primary" type="button" data-expense-add>추가 지출 추가</button></footer>':'';const fn={history:renderHistory,change:renderChange,options:renderOptions,profit:renderProfit,fixed:renderFixed,sales_analytics:renderSalesAnalytics,sales_day:renderSalesDay,revenue:renderRevenue,sales_menu:renderSalesMenu,sales_channels:renderSalesChannels,sales_material:renderSalesMaterial,sales_extra:renderSalesExtra,sales_waste:renderSalesWaste,sales_fixed:renderSalesFixed,sales_expense:renderSalesExpense,sales_tax:renderSalesTax,overview:renderOverview,statement:renderStatement,ledger:renderLedger,channels:renderChannels}[s.kind];$('content').innerHTML=fn(s);renderNav();bindDetails();}
    function renderNav(){const d=screens[active].domain;$('catalog-meta').textContent=`총 ${Object.keys(screens).length}개 화면 · ${screens[active].route}`;$('domain-nav').innerHTML=Object.entries(domains).map(([k,v])=>`<button class="nav-button domain-button ${k===d?'active':''}" data-domain="${k}">${v.label} ${v.screens.length}</button>`).join('');$('screen-nav').innerHTML=domains[d].screens.map(k=>`<button class="nav-button ${k===active?'active':''}" data-screen="${k}">${screens[k].label}</button>`).join('');document.querySelectorAll('[data-domain]').forEach(b=>b.onclick=()=>setScreen(domains[b.dataset.domain].screens[0]));document.querySelectorAll('[data-screen]').forEach(b=>b.onclick=()=>setScreen(b.dataset.screen));}
    function bindDetails(){document.querySelectorAll('[data-detail]').forEach(b=>b.onclick=()=>openDetail(Number(b.dataset.detail)));document.querySelectorAll('.tab,.chip').forEach(b=>b.onclick=()=>{b.parentElement.querySelectorAll('button').forEach(x=>x.classList.remove('active'));b.classList.add('active')});document.querySelectorAll('[data-history-filter]').forEach(button=>button.onclick=()=>openHistoryFilter(button.dataset.historyScreen,button.dataset.historyFilter));document.querySelectorAll('[data-fixed-period]').forEach(button=>button.onclick=openFixedPeriod);document.querySelectorAll('[data-sales-period]').forEach(button=>button.onclick=openSalesPeriod);document.querySelectorAll('[data-screen-link]').forEach(button=>button.onclick=()=>setScreen(button.dataset.screenLink));document.querySelectorAll('[data-revenue-more]').forEach(button=>button.onclick=()=>{revenueShowAll=true;render()});document.querySelectorAll('[data-expense-delete]').forEach(button=>button.onclick=()=>openExpenseDelete(Number(button.dataset.expenseDelete)));const addExpense=document.querySelector('[data-expense-add]');if(addExpense)addExpense.onclick=openExpenseAdd}
    function compare(rows){return `<section class="card">${rows.map(r=>`<div class="compare"><span>${r[0]}</span><span class="before">${r[1]}</span><span class="arrow">→</span><strong class="after">${r[2]}</strong></div>`).join('')}</section>`}
    function openDetail(i){const s=screens[active],r=s.rows[i];if(s.kind!=='change')return;const direct=active==='recipe_changes'?[['판매가','9,500원','9,000원'],['부자재','120원','320원']]:[['안전재고','1kg','1.5kg']];const derived=active==='recipe_changes'?[['세금','863.64원','818.18원'],['순이익','2,278.92원','1,780.88원']]:[['기준 단가','5.20원/g','4.95원/g']];$('sheet-body').innerHTML=`<h2>${r[1]}</h2><div class="sheet-meta">${r[0]} · ${s.entity[0]}</div><div class="sheet-section">직접 수정</div>${compare(direct)}<div class="sheet-section">자동 갱신</div>${compare(derived)}`;$('overlay').classList.add('open')}
    function filterChoices(group,items,current){return `<div class="filter-options">${items.map(item=>`<button class="filter-option ${item===current?'selected':''}" type="button" data-filter-group="${group}" data-filter-value="${item}">${item}</button>`).join('')}</div>`}
    function openHistoryFilter(key,group){const isType=group==='type';const typeItems=key==='discard'?['전체','조리 전 폐기','조리 후 폐기']:['전체','입고','판매 소진','폐기','조정'];const items=isType?typeItems:['최근 1개월','최근 3개월','최근 6개월','전체'];const filter=historyFilters[key];$('sheet-body').innerHTML=`<h2>${isType?'유형':'기간'}</h2><div class="sheet-section">${isType?'기록 유형':'조회 기간'}</div>${filterChoices(group,items,filter[group])}<button class="primary filter-apply" type="button" data-filter-apply>적용</button>`;$('overlay').classList.add('open');document.querySelectorAll('[data-filter-group]').forEach(button=>button.onclick=()=>{document.querySelectorAll(`[data-filter-group="${group}"]`).forEach(item=>item.classList.remove('selected'));button.classList.add('selected')});document.querySelector('[data-filter-apply]').onclick=()=>{const selected=document.querySelector(`[data-filter-group="${group}"].selected`);if(selected)filter[group]=selected.dataset.filterValue;$('overlay').classList.remove('open');render()}}
    function openFixedPeriod(){$('sheet-body').innerHTML=`<h2>기간</h2><div class="sheet-section">월 선택</div>${filterChoices('fixed_period',Object.keys(fixedActuals),fixedPeriod)}<button class="primary filter-apply" type="button" data-fixed-apply>적용</button>`;$('overlay').classList.add('open');document.querySelectorAll('[data-filter-group="fixed_period"]').forEach(button=>button.onclick=()=>{document.querySelectorAll('[data-filter-group="fixed_period"]').forEach(item=>item.classList.remove('selected'));button.classList.add('selected')});document.querySelector('[data-fixed-apply]').onclick=()=>{const selected=document.querySelector('[data-filter-group="fixed_period"].selected');if(selected)fixedPeriod=selected.dataset.filterValue;$('overlay').classList.remove('open');render()}}
    function openSalesPeriod(){const items=['오늘','어제','최근 7일','이번달','지난달','직접 설정'];$('sheet-body').innerHTML=`<h2>기간</h2><div class="sheet-section">조회 기간</div>${filterChoices('sales_period',items,salesPeriod)}<button class="primary filter-apply" type="button" data-sales-apply>적용</button>`;$('overlay').classList.add('open');document.querySelectorAll('[data-filter-group="sales_period"]').forEach(button=>button.onclick=()=>{if(button.dataset.filterValue==='직접 설정'){openDirectSalesPeriod();return}document.querySelectorAll('[data-filter-group="sales_period"]').forEach(item=>item.classList.remove('selected'));button.classList.add('selected')});document.querySelector('[data-sales-apply]').onclick=()=>{const selected=document.querySelector('[data-filter-group="sales_period"].selected');if(selected)salesPeriod=selected.dataset.filterValue;$('overlay').classList.remove('open');render()}}
    function openDirectSalesPeriod(){$('sheet-body').innerHTML=`<h2>직접 설정</h2><div class="sheet-section">조회 기간</div><div class="date-range"><label class="date-field">시작일<input type="date" data-sales-start value="${salesCustomStart}"></label><label class="date-field">종료일<input type="date" data-sales-end value="${salesCustomEnd}"></label></div><button class="primary filter-apply" type="button" data-direct-sales-apply>적용</button>`;document.querySelector('[data-direct-sales-apply]').onclick=()=>{const start=document.querySelector('[data-sales-start]').value,end=document.querySelector('[data-sales-end]').value;if(!start||!end||start>end)return;salesCustomStart=start;salesCustomEnd=end;salesPeriod='직접 설정';$('overlay').classList.remove('open');render()}}
    function openExpenseDelete(index){const row=salesExpenseRows[index];if(!row)return;$('sheet-body').innerHTML=`<h2>추가 지출 삭제</h2><div class="sheet-meta">${row[0]} · ${row[2].toLocaleString('ko-KR')}원</div><p class="confirm-copy">이 지출을 삭제할까요? 삭제한 내역은 복구할 수 없어요.</p><div class="confirm-actions"><button class="confirm-cancel" type="button" data-expense-cancel>취소</button><button class="confirm-delete" type="button" data-expense-confirm>삭제</button></div>`;$('overlay').classList.add('open');document.querySelector('[data-expense-cancel]').onclick=()=>$('overlay').classList.remove('open');document.querySelector('[data-expense-confirm]').onclick=()=>{salesExpenseRows.splice(index,1);$('overlay').classList.remove('open');render()}}
    function openExpenseAdd(){$('sheet-body').innerHTML=`<h2>추가 지출 추가</h2><div class="sheet-meta">8월 22일 (토)</div><div class="expense-form"><label class="date-field">지출명<input type="text" data-expense-name placeholder="예: 주방 소모품"></label><label class="date-field">메모<input type="text" data-expense-memo placeholder="선택 입력"></label><label class="date-field">금액<input type="number" min="0" step="1" inputmode="numeric" data-expense-amount placeholder="0"></label></div><button class="primary filter-apply" type="button" data-expense-save>추가</button>`;$('overlay').classList.add('open');document.querySelector('[data-expense-save]').onclick=()=>{const name=document.querySelector('[data-expense-name]').value.trim();const memo=document.querySelector('[data-expense-memo]').value.trim();const amount=Number(document.querySelector('[data-expense-amount]').value);if(!name||!Number.isFinite(amount)||amount<=0)return;salesExpenseRows.push([name,memo,amount]);$('overlay').classList.remove('open');render()}}
    function setScreen(k){if(!screens[k])k='stock';active=k;$('overlay').classList.remove('open');history.replaceState(null,'',`${location.pathname}?screen=${k}`);render();$('content').scrollTop=0}
    $('overlay').onclick=e=>{if(e.target===$('overlay'))$('overlay').classList.remove('open')};
    setScreen(new URLSearchParams(location.search).get('screen')||'stock');
  </script>
</body>
</html>
