name: operations-health

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: operations-health-staging
  cancel-in-progress: false

jobs:
  staging:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24

      - name: Check staging health
        id: health
        continue-on-error: true
        env:
          OPS_HEALTH_TARGET: staging
          OPS_HEALTH_URL: ${{ secrets.STAGING_OPS_HEALTH_URL }}
          OPS_HEALTH_TOKEN: ${{ secrets.STAGING_OPS_HEALTH_TOKEN }}
        run: node scripts/check-ops-health.mjs

      - name: Create, update, or close the incident issue
        env:
          GITHUB_TOKEN: ${{ github.token }}
          OPS_HEALTH_OK: ${{ steps.health.outcome == 'success' }}
        run: node scripts/sync-ops-health-issue.mjs

      - name: Fail degraded health check
        if: steps.health.outcome != 'success'
        run: exit 1
