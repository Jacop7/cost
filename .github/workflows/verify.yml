# 빠른 Node 하한/개발 버전 검사와 Docker 기반 전체 DB 검사를 같은 commit SHA에 붙인다.
# `protected-gate`는 두 선행 job이 모두 성공한 뒤에만 성공하므로 ruleset의 단일 필수 문이다.
name: verify

on:
  push:
    branches: ['**']

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # ⚠ **하한과 실제 개발 버전 둘 다** 돈다.
      #   20 만 돌면 24 에서만 나는 문제를, 24 만 돌면 하한을 깨는 의존성을 못 잡는다.
      #   실제로 두 번 다 겪었다 — `--experimental-strip-types`(24 전용)와
      #   `jsdom@30`(`^22.22.2 || ^24.15.0 || >=26` 요구)이 하한을 깼다.
      # ⚠ 하한은 **정확한 버전으로 못 박는다.** `20` 이라고 적으면 최신 20.x 를 받아
      #   실제 최저 버전은 한 번도 안 돌아 본 채 초록이 된다. `20.19.4` 는
      #   `react-native@0.81`·`metro@0.83` 이 선언한 하한이고 루트 `engines` 와 같다.
      matrix:
        node: ['20.19.4', 24]
    name: verify (node ${{ matrix.node }})
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # ① 타입 · ② 시험 2종(DB 제외) · ③ ACL 보안 · ⑥ 웹 번들
      - run: pnpm verify --no-db

  full-db-required:
    name: full-db-required
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Exact SHA checkout
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain)"

      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Start isolated Supabase stack
        run: pnpm --filter @sikjae/db start

      - name: Normalize local admin ACL
        shell: bash
        run: |
          set -euo pipefail
          bash packages/db/scripts/admin-acl.sh --local postgres fix
          bash packages/db/scripts/admin-acl.sh --local postgres check

      - name: Full six-stage verification
        run: pnpm verify

      - name: Stop Supabase stack
        if: always()
        run: pnpm --filter @sikjae/db exec supabase stop --no-backup

  protected-gate:
    name: protected-gate
    needs: [verify, full-db-required]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Gate anchor와 과거 COMMIT snapshot의 blob을 재검증한다.
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Review protocol self-test
        run: corepack pnpm fable:self-test
      - name: Bind successful gates to the exact commit
        shell: bash
        env:
          REQUIRED_RESULTS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          node scripts/protected-gate-validator.mjs --ci --output protected-gate-evidence.json
      - uses: actions/upload-artifact@v4
        with:
          name: protected-gate-${{ github.sha }}
          path: protected-gate-evidence.json
          if-no-files-found: error
          retention-days: 90
