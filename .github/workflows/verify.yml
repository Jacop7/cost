# 전체 검증을 자동으로 돌린다 — 지금까지는 손으로만 돌렸다.
#
# ⚠ **DB 두 단계는 여기서 못 돈다.** `fresh-db.sh` 는 로컬 supabase 컨테이너에
#   `docker exec` 하고, 거기서 `auth.users` 모양을 그대로 베껴 온다. CI 에 그 스택이
#   없으므로 `--no-db` 로 뺀다. 스크립트가 끝에 "건너뛴 것" 을 적으므로 초록이
#   "전부 통과" 로 읽히지 않는다.
#
#   DB·업그레이드 경로는 로컬에서 `pnpm verify` 로 돌린다. 그 둘을 CI 로 옮기려면
#   supabase 스택을 띄우는 단계가 먼저 필요하다(아직 없다).
name: verify

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # ⚠ **하한과 실제 개발 버전 둘 다** 돈다.
      #   20 만 돌면 24 에서만 나는 문제를, 24 만 돌면 하한을 깨는 의존성을 못 잡는다.
      #   실제로 두 번 다 겪었다 — `--experimental-strip-types`(24 전용)와
      #   `jsdom@30`(`^22.22.2 || ^24.15.0 || >=26` 요구)이 하한을 깼다.
      # ⚠ 하한은 **정확한 버전으로 못 박는다.** `20` 이라고 적으면 최신 20.x 를 받아
      #   실제 최저 버전은 한 번도 안 돌아 본 채 초록이 된다. `20.19.4` 는
      #   `react-native@0.81`·`metro@0.83` 이 선언한 하한이고 루트 `engines` 와 같다.
      matrix:
        node: ['20.19.4', 24]
    name: verify (node ${{ matrix.node }})
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # ① 타입 · ② 시험 3종 · ⑤ 웹 번들
      - run: pnpm verify --no-db
